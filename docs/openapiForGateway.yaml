          description: "The temporal relation type of **timerel** to be performed.\
            \ \n This **should** be one from the available options in the Enum list.\
            \ \n If the relation is ** between ** it should be always accomodated\
            \ with a ** time ** and ** endtime ** property.  \n If the relation is\
            \ ** before ** or ** after **it should be always accomodated ** only**\
            \ with a ** time ** property."
        time:
          type: string
          description: "This parameter specifies the **start time** for the temporal-query\
            \ in `ISO8601` format. \n data exchange currently accepts `IST` and `UTC`\
            \ time zones for the temporal query."
        endtime:
          type: string
          description: "This parameter specifies the **end time** for the temporal-query\
            \ in `ISO8601` format. \n data exchange currently accepts `IST` and `UTC`\
            \ time zones for the temporal query. \nIf **timerel** is `between` time\
            \ and endtime are mandatory"
        timeProperty:
          type: string
          enum:
            - observationDateTime
      example:
        timerel: between
        time: 2020-06-01 14:20:00+00:00
        endtime: 2020-06-03 15:00:00+00:00
