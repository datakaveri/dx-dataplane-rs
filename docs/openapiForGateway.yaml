  parameters:
    AuthorizationHeader:
      name: Authorization
      in: header
      description: "A ** valid data exchange Auth token ** to process the request.\
        \ \n This field is ** mandatory ** for accessing a ** resource ** .  \n If\
        \ not provided with a valid token, user will be responded with ** 401 Unauthorized\
        \ ** ."
      required: false
      schema:
        type: string
    IdParam:
      name: id
      in: query
      description: "A ** valid data exchange ID ** of the resource. \n Information\
        \ about the data exchange ID of the resource and security scope of the resource\
        \ can be obtained from the ** DX(Data exchange) catalogue server ** ."
      required: true
      schema:
        type: string
        format: uuid
        maxLength: 36
    GeoPropertyParam:
      name: geoproperty
      in: query
      description: Name of the ** geospatial ** property in the ** DX(Data exchange)
        data descriptor **. <br /> The current version of the API ** mandates ** it
        to be equal to `location`
      schema:
        type: string
        enum:
          - location
    GeoRelParam:
      name: georel
      in: query
      description: 'The relation type of geoquery to be performed.  Examples:  - `near;maxDistance==1000`
        (valid only with Point)  - `within`  - `intersects`'
      schema:
        type: string
        pattern: ^(near(;.*)?|within|intersects)$
        example: near;maxDistance==1000
    GeometryParam:
      name: geometry
      in: query
      description: "The geometry type of **geoquery** to be performed. \n This **should**\
        \ be one from the available options in the Enum list. \nThe list is **case\
        \ sensitive** "
      schema:
        type: string
        enum:
          - Point
          - point
          - Polygon
          - polygon
          - LineString
          - linestring
          - bbox
    CoordinatesParam:
      name: coordinates
      in: query
      description: "The coordinates for a specific geometry query type. \n This parameter\
        \ accepts both ** one dimentional array and multi dimentional arrays ** based\
        \ on the ** geometry** type. \n For e.g, [longitude-1,latitude-1] should be\
        \ used for geometry **point**.  \n[[[longitude-1,latitude-1], [longitude-2,latitude-2],....,\
        \ [longitude-n,latitude-n]]] should be used for geometry **polygon**. \n [[longitude-1,latitude-1],\
        \ [longitude-2,latitude-2],...., [longitude-n,latitude-n]] should be used\
        \ for geometry **bbox and linestring **. \n Maximum of 10 latitude, longitude\
        \ pairs can be used for geometry **polygon, bbox and linestring **. \n Note:\
        \ The data-type of this field is a string, therefore the coordinates are a\
        \ string encoded multidimensional array. \n Maximum precision allowed is upto\
        \ 6 decimal places."
      schema:
        type: string
    MaxDistanceParam:
      name: maxDistance
      in: query
      description: "The maximum distance to be queried from center point in meters.\
        \ \n This is applicable and is **mandatory** for **point** geometry.\n It\
        \ should be used along with relation **near**."
      schema:
        type: number
        minimum: 0
        maximum: 1000
    QParam:
      name: q
      in: query
      description: "The attribute query is used for querying ** allowed quantitative**\
        \ properties. \n Used to query on a value of a resource attribute using `<`,`>`,`<=`,`>=`,`!=`,\
        \ `==` operators. \n For e.g, attribute > value, attribute < value, attribute\
        \ >= value, attribute <= value, attribute != value and attribute == value.\
        \ \n Allowed values for all operators is double. \n For the operator `==`\
        \ if the query is on `id` then the only value allowed is an `data exchange\
        \ ID` of a resource."
      schema:
        type: string
        maxLength: 512
    AttrsParam:
      name: attrs
      in: query
      description: "The attrs parameter is used as an **application filter**. \n This\
        \ is an optional parameter. It can be used to provide the list of attributes\
        \ which the consumer expects to be responded by the server. \n The consumer\
        \ is expected to provide **only** the attributes available in the **data descriptor**\
        \ of the item in the DX(Data exchange) Catalogue. \n Minimum of 1 and a Maximum\
        \ of 5 attributes can be provided in a comma separated fashion."
      schema:
        type: string
        maxLength: 512
        minLength: 1
    OptionsParam:
      name: options
      in: query
      description: "The **options** parameter is used for obtaining the **number of\
        \ hits** for a query. \n It should be used along with the ** valid ** `spatial`,\
        \ `attribute` or `complex` queries. \n It **cannot** be used along with a\
        \ **attrs** filter. The value should be equal to `count` and it is **case\
        \ sensitive**"
      schema:
        type: string
        enum:
          - count
    TimerelParam:
      name: timerel
      in: query
      description: The temporal relation type of **timerel** to be performed.
      schema:
        type: string
        enum:
          - between
          - before
          - after
          - during
    TimeParam:
      name: time
      in: query
      description: "This parameter specifies the **start time** for the temporal-query\
        \ in `ISO8601` format. \n data exchange currently accepts `IST` and `UTC`\
        \ time zones for the temporal query."
      schema:
        type: string
    EndtimeParam:
      name: endtime
      in: query
      description: "This parameter specifies the **end time** for the temporal-query\
        \ in `ISO8601` format. \n data exchange currently accepts `IST` and `UTC`\
        \ time zones for the temporal query. \nIf **timerel** is `between` time and\
        \ endtime are mandatory"
      schema:
        type: string
    FormatHeader:
      name: format
      in: header
      description: format in header could be added to get the response in required
        encoding through `/async/status` API
      schema:
        type: string
        enum:
          - json
          - csv
    SearchIdParam:
      name: searchId
      in: query
      description: searchId returned while submitting request through `/async/search`
      required: true
      schema:
        type: string
        maxLength: 512
  requestBodies:
    PostEntitiesRequest:
      description: Post entities query request
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/postEntitiesSchema'
    PostTemporalRequest:
      description: Post temporal entities query request
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/postTemporalSchema'