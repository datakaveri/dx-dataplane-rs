      type: array
      minItems: 1
      maxItems: 5
      items:
        type: string
        format: uuid
        maxLength: 36
        pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
      description: ''
  example:
    name: alias-name-of-application
    type: subscription
    entities:
      - UUID

