      description: This is used to stream data in csv format for a given resource ID. (Post Search Data). Use same format of request data sample as it is in /search API.
      operationId: downloadPutSearchData
      security:
        - authorization: [ ]
      parameters:
        - name: did
          in: header
          required: false
          schema:
            type: string
            format: uuid
        - name: id
          in: path
          required: true
          description: 'A <b> valid data exchange ID </b> of the resource. <br/> Information about the data exchange ID of the resource and security scope of the resource can be obtained from the <b> DX(Data exchange) Controlplane server </b> .'
          schema:
            type: string
            format: uuid
        - name: sort
          in: query
          description: >
            This parameter allows sorting the results by up to 3 fields, separated by a semicolon (;).
            The format for each field is `fieldName:asc` or `fieldName:desc`.
            For example: `itemCreatedAt:desc;dataReadiness:asc;name:desc` will sort by creation date (descending),
            then dataReadiness (ascending), then name (descending).
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Success
        '401':
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/standardInvalidTokenErrorResponse"
          description: 'Unauthorized - Invalid/missing token'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenResponse'
        '400':
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/invalidParamBadRequestErrorResponse"
          description: 'Bad query - Empty response | Missing/Invalid parameters'

      x-codeSamples:
        - lang: 'cURL'
          label: 'post download data'
          source: |
            curl --location --request POST 'https://${HOSTNAME}/ngsi-ld/v2/f29d4456-b712-4b96-af64-82916bffcb62/download' \
            --header 'Authorization: Bearer <tokenValue>' \
            --header 'Content-Type: application/json' \
            --data-raw '{
                "searchCriteria": [
                    {
                        "searchType": "beforeTemporal",
                        "field": "observationDateTime",
                        "values": ["2025-05-02T09:15:27+0530"]
                    }
                ]
            }'
  /admin/elasticsearch/createIndex:
    post:
      tags:
        - Admin
      summary: Onboard dataset index into Elasticsearch
      description: Creates an Elasticsearch index using provided `indexName` and `dataDescriptor` (mappings).
      operationId: onboardElasticsearchIndex
      security:
        - authorization: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - dataDescriptor
              properties:
                id:
                  type: string
                  description: Dataset ID; final index will be TENANT__ID
                dataDescriptor:
                  type: object
                  properties:
                    refNumber:
                      type: object
                      description: Elasticsearch index mappings object
      responses:
        '201':
          description: Index created
          content:
            application/json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                    example: dx:dataplane:success
                  title:
                    type: string
                    example: Created
                  detail:
                    type: string
                    example: Index created successfully
        '409':
          description: Index Already Exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/generalResourceAlreadyExistErrorResponse'

        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/standardBadRequestErrorResponse'

  /ngsi-ld/v1/ingestion/entities:
    post:
      tags:
        - Data Ingestion Adaptor
      summary: Ingestion adapter
      operationId: postIngestionAdaptorEntities
      security:
        - authorization: [ ]

      x-codeSamples:
        - lang: 'cURL'
          label: 'ingestion'
          source: |
            curl --location --request POST 'https://example.com/ngsi-ld/v1/ingestion/entities' \
            --header 'token: <tokenValue>'
