  /ngsi-ld/v2/{id}/download:
    get:
      tags:
        - Download CSV
      summary: Get Data CSV
      description: This is used to stream data in csv format for a given resource ID. (Get Search Data)
      operationId: downloadIdEntityData
      security:
        - authorization: [ ]
      parameters:
        - name: id
          in: path
          required: true
          description: 'A <b> valid data exchange ID </b> of the resource. <br/> Information about the data exchange ID of the resource and security scope of the resource can be obtained from the <b> DX(Data exchange) catalogue server </b> .'
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          description: Page number for pagination
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: size
          in: query
          description: Page size for pagination
          required: false
          schema:
            type: integer
            minimum: 1
            default: 100
        - name: sort
          in: query
          description: 'This parameter is used to sort the results basis on this property. <br/> The default sortBy property is `observationDateTime:desc` . <br/> The user could provide any property among `observationDateTime` and `itemCreatedAt` of the resource to sort the data. <br/> If the user provides a property which is not part of the resource, the API will throw a `400-Bad Request` error.'
          required: false
          schema:
            type: string
            enum: [ observationDateTime:desc, itemCreatedAt:desc, observationDateTime:asc, itemCreatedAt:asc ]
      responses:
        '200':
          description: Success

    post:
      tags:
        - Download CSV
      summary: Post Data CSV
      description: This is used to stream data in csv format for a given resource ID. (Post Search Data)
      operationId: downloadPutSearchData
      security:
        - authorization: [ ]
      parameters:
        - name: id
          in: path
          required: true
          description: 'A <b> valid data exchange ID </b> of the resource. <br/> Information about the data exchange ID of the resource and security scope of the resource can be obtained from the <b> DX(Data exchange) catalogue server </b> .'
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          description: Page number for pagination
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: size
          in: query
          description: Page size for pagination
          required: false
          schema:
            type: integer
            minimum: 1
            default: 100
        - name: sort
          in: query
          description: >
            This parameter allows sorting the results by up to 3 fields, separated by a semicolon (;).
            The format for each field is `fieldName:asc` or `fieldName:desc`.
            For example: `itemCreatedAt:desc;dataReadiness:asc;name:desc` will sort by creation date (descending),
            then dataReadiness (ascending), then name (descending).
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Success
  /admin/elasticsearch/createIndex:
    post:
      tags:
        - Admin
      summary: Onboard dataset index into Elasticsearch
      description: Creates an Elasticsearch index using provided `indexName` and `dataDescriptor` (mappings).
      operationId: onboardElasticsearchIndex
      security:
        - authorization: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - dataDescriptor
              properties:
                id:
                  type: string
                  description: Dataset ID; final index will be TENANT__ID
                dataDescriptor:
                  type: object
                  properties:
                    refNumber:
                      type: object
                      description: Elasticsearch index mappings object
      responses:
        '201':
          description: Index created
          content:
            application/json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                    example: dx:dataplane:success
                  title:
                    type: string
                    example: Created
                  detail:
                    type: string
                    example: Index created successfully
        '409':
          description: Index Already Exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/generalResourceAlreadyExistErrorResponse'

        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/standardBadRequestErrorResponse'
