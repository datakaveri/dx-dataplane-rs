/ngsi-ld/v1/temporal/entities:
  get:
    tags:
      - Temporal Entities
    operationId: getTemporalEntities
    summary: Temporal Entities Search
    description: Search for temporal entities with various filters
    security:
      - authorization: [ ]
    parameters:
      - name: did
        in: header
        required: false
        schema:
          type: string
          format: uuid
      - name: id
        in: query
        required: true
        schema:
          type: string
          format: uuid
      - name: timerel
        in: query
        required: true
        description: Temporal relation type
        schema:
          type: string
          enum: [ between, before, after]
      - name: timeAt
        in: query
        required: true
        description: Start time in ISO8601 format
        schema:
          type: string
      - name: endTimeAt
        in: query
        description: End time in ISO8601 format
        schema:
          type: string
      - name: timeproperty
        in: query
        description: Time property to filter on
        schema:
          type: string
          enum: [ observationDateTime, observedAt ]
      - name: limit
        in: query
        description: Limit the no of data to be shown
        schema:
          type: integer
          minimum: 1
          default: 100
      - name: offset
        in: query
        description: Offset to see more data
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: lastN
        in: query
        description: Get the last N records, and it will sort on time property in descending order.
        schema:
          type: integer
          minimum: 1
      - name: count
        in: query
        description: Include count of matching entities in the response
        schema:
          type: boolean
          default: false
      - name: q
        in: query
        description: For attribute based search. The attribute query is used for querying allowed quantitative properties. Used to query on a value of a resource attribute using <,>,<=,>=,!=, == operators. For e.g, attribute > value, attribute < value, attribute >= value, attribute <= value, attribute != value and attribute == value. Allowed values for all operators is double. For the operator == if the query is on id then the only value allowed is an data exchange ID of a resource. Multiple value is allow with comma(,) separate, maximum 10 values is allowed.
        schema:
          type: string
      - name: omit
        in: query
        description: Comma-separated list of properties to omit from the response, maximum value is allow is 5.
        schema:
          type: string
      - name: orderBy
        in: query
        description: Comma-separated list of properties to orderBy from the response. By default it is `desc`, when it is given only. Could be used with `asc` or `desc` keyword. E.g., `observationDateTime:desc,speed:asc`, or `observationDateTime,speed:asc`, or `observationDateTime:desc,speed`, or `observationDateTime,speed`
        schema:
          type: string
      - name: pick
        in: query
        description: Comma-separated list of properties to pick from the response, maximum value is allow is 5.
        schema:
          type: string
      - name: geometry
        in: query
        description: GeoJSON geometry type
        schema:
          type: string
          enum: [ Point, Polygon, LineString, bbox, point, polygon, linestring, BBOX ]
      - name: coordinates
        in: query
        description: Coordinates for the geometry
        schema:
          type: string
      - name: georel
        in: query
        description: Spatial relationship type
        schema:
          type: string
          enum: [ near;maxdistance, within, intersects ]
      - name: geoproperty
        in: query
        description: Geospatial property name
        schema:
          type: string
          enum: [ location ]
      - name: format
        in: query
        schema:
          type: string
          enum: [ simplified ]
      - name: options
        in: query
        description: Perform aggregation
        schema:
          type: string
          enum: [ aggregatedValues ]
      - name: aggrMethods
        in: query
        description: Comma separated list of aggregation methods, only applicable when options=aggregatedValues. Supported values are `totalCount`, `distinctCount`, `min`, `max`, `sum`, `avg`, `stddev`.
        schema:
          type: string
          #enum: [ totalCount, distinctCount, min, max, sum, avg, stddev ]
    responses:
      '200':
        description: Successful retrieval of temporal entities
        content:
          application/json:
            schema:
              anyOf:
                - $ref: '../components/schemas/temporal.yaml#/temporalEntityresponse'
                - $ref: '../components/schemas/temporal.yaml#/countResponse'
          application/ld+json:
            schema:
              anyOf:
                - $ref: '../components/schemas/temporal.yaml#/temporalEntityresponse2'
                - $ref: '../components/schemas/temporal.yaml#/countResponse'
          application/geo+json:
            schema:
              anyOf:
                - $ref: '../components/schemas/temporal.yaml#/temporalEntityresponse2'
                - $ref: '../components/schemas/temporal.yaml#/countResponse'
      '400':
        description: Bad Request
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/NgsiLdSubscriptionErrorResponse400'
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/NgsiLdSubscriptionErrorResponse401'
      '404':
        description: Not Found
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/NgsiLdSubscriptionErrorResponse404'
      '413':
        description: Payload Too Large
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/NgsiLdSubscriptionErrorResponse413'

/ngsi-ld/v1/temporal/entityOperations/query:
  post:
    tags:
      - Temporal Entities
    summary: Temporal Post Search Query
    security:
      - authorization: [ ]
    operationId: postTemporalEntitiesSearch
    parameters:
      - name: did
        in: header
        required: false
        schema:
          type: string
          format: uuid
      - name: limit
        in: query
        description: Limit the no of data to be shown
        schema:
          type: integer
          minimum: 1
          default: 100
      - name: offset
        in: query
        description: Offset to see more data
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: count
        in: query
        description: Include count of matching entities in the response
        schema:
          type: boolean
      - name: format
        in: query
        schema:
          type: string
          enum: [ simplified ]
    requestBody:
      description: 'Temporal Entities request body'
      content:
        application/json:
          schema:
            $ref: '../components/schemas/temporal.yaml#/complex-temporal-geo'
          example:
            {
              "type": "Query",
              "entities": [
                {
                  "id": "UUID"
                }
              ],
              "geoQ": {
                "geometry": "Point",
                "coordinates": [ 21.178,72.834 ],
                "georel": "near;maxDistance=1000",
                "geoproperty": "location"
              },
              "temporalQ": {
                "timerel": "between",
                "timeAt": "2020-10-18T14:20:00Z",
                "endTimeAt": "2020-10-19T14:20:00Z",
                "timeproperty": "observationDateTime"
              },
              "q": "speed>30.0",
              "pick": "id,speed"
            }
      required: false

    responses:
      200:
        description: 'Successful complex search query'
        content:
          application/json:
            schema:
              anyOf:
                - $ref: '../components/schemas/temporal.yaml#/temporalEntityresponse'
                - $ref: '../components/schemas/temporal.yaml#/countResponse'
          application/ld+json:
            schema:
              anyOf:
                - $ref: '../components/schemas/temporal.yaml#/temporalEntityresponse2'
                - $ref: '../components/schemas/temporal.yaml#/countResponse'
          application/geo+json:
            schema:
              anyOf:
                - $ref: '../components/schemas/temporal.yaml#/temporalEntityresponse2'
                - $ref: '../components/schemas/temporal.yaml#/countResponse'

      400:
        content:
          application/json:
            schema:
              "$ref": "../components/schemas/common.yaml#/NgsiLdSubscriptionErrorResponse400"
        description: 'Bad query | Missing/Invalid temporal parameters | Missing/Invalid geo parameters'

      401:
        content:
          application/json:
            schema:
              "$ref": "../components/schemas/common.yaml#/NgsiLdSubscriptionErrorResponse401"
        description: Unauthorized

      413:
        content:
          application/json:
            schema:
              "$ref": "../components/schemas/common.yaml#/NgsiLdSubscriptionErrorResponse413"
        description: 'Payload Too Large'

      404:
        content:
          application/json:
            schema:
              "$ref": "../components/schemas/common.yaml#/NgsiLdSubscriptionErrorResponse404"
        description: 'Resource not found'

    description: |
      The `/temporal/entityOperations/query` end point allows a consumer to query on data published based on a <b>spatial</b>,<b> temporal </b> and <b>attribute</b> properties. The <b>spatial</b> queries should be submitted as a geo json as described in the API. All the queries requires a <b> valid data exchange</b> `id` of the resource within the `entities` json object as per the schema. These apis are intended to be used by DX(Data exchange) Data *Consumers*.

        - <b>Allowed Search Operations</b>:
            - <b> Temporal Search : </b> which queries the temporal property of the resource.
            - <b> Spatial (Geo) Search : </b> which queries the geo property of the resource.
            - <b> Attribute Search : </b> which queries the valid attributes as per the data descriptor.
            - <b> Complex Search : </b> which queries using the combination of the above three.

      #### Temporal search
      Temporal search accepts time property based queries which are specified in ISO 8601 format. The params and their accepted values are -
        - <b>timerel</b>: The time relation of the query. Should be either `between`, `before` or `after`.
        - <b>timeAt</b>: Start time for the temporal query in `ISO 8601` format.
        - <b>endTimeAt</b>: End time for the temporal query in `ISO 8601` format. Applicable only for `timerel = between`.
        - <b>timeproperty</b>: The time property tell us on which field we are applying time. By default it is 'observationDateTime'. Allowed values are `observationDateTime` and `observedAt`.
        - Note, The time difference between `timeAt` and `endTimeAt` should be less than `20 days`. For `before` and `after` queries, `10 days` of data `before` or `after` the specified time will be provided.

      #### Spatial (Geo) Search
      Geo search accepts geojson based queries. The params and their accepted values are briefed below -
        - <b>geoproperty</b>:
            - Specifies the name of the <b> geospatial </b> property in the <b> DX(Data exchange) data descriptor </b>.
            - The current version of the API <b> mandates </b> it to be equal to `location`
        - <b>georel</b>:
            - Specifies the spatial relationship to be queried.
            - The relation type of <b>geoquery</b> can be <b>one of</b> `near;maxdistance=<distance_in_meters>`, `within`, `intersects`.
            - The relation <b> near </b> should be always accomodated with a <b> maxdistance </b> property.
            - Apart from <b> maxdistance</b> , all other fields in the Enum list are <b> case sensitive </b> fields.
            - The relation <b> near;maxdistance </b> is applicable only for a <b> point </b>.
            - The relation <b> within </b> and  <b> intersects </b> are applicable only for <b> bbox, polygon and linestring</b>.

        - <b>geometry</b>:
            - Specifies the GeoJson geometries.
            - Should be One of `Point`(equivalent for a circle), `Polygon`, `LineString`, `bbox`.
            - <b>Point</b>: Point and radius query
                - coordinates: Specifies the  center point of the circle, for e.g, `[73,13]`. <br/>Note, format is [longitude, latitude]
                - maxDistance: Specifies the Radius from the center point in meters, for e.g `100`. `maxValue` : 1000
                - georel: In this version of DX(Data exchange) API, the allowed relationship search for a circle is `near` with a `maxdistance` in meters specified. This will be equivalent to a `within` query. Format is `near;maxdistance=<distance_in_meters>`
            - <b>Polygon</b>: Polygon/Multi-Polygon query
                - coordinates: Specifies the  coordinates of the polygon, for e.g, `[[[73,13],[73,12],[73,13]]]`.  <br/>Note, format is [longitude, latitude] and the first coordinate must be same as last.
                - `minNumberOfCoOrdinates` : 4 and `maxnNumberOfCoOrdinates` : 10
                - georel: `within`, `intersects`
            - <b>LineString</b>: Multi line string
                - coordinates: Specifies the coordinates of the multi-line, for e.g, `[[73,13],[74,15],[75,16]]`. <br/>Note, format is [longitude, latitude]
                - `minNumberOfCoOrdinates` : 2 and `maxnNumberOfCoOrdinates` : 10
                - georel:  `within`, `intersects`
            - <b>bbox</b>: Bounding box
                - coordinates: `[[top-left],[bottom-right]]`. e.g, `[[73,13],[74,12]]`. <br/>Note, format is [longitude, latitude].
                - georel:  `within`, `intersects`

      #### Attribute search
      The attribute query is used for querying <b> allowed quantitative</b> properties.
        - Used to query on a value of a resource attribute using `<`,`>`,`<=`,`>=`,`!=`,`==` operators.
        - For e.g, attribute > value, attribute < value, attribute >= value, attribute <= value and attribute == value.
        - Allowed values for all operators is double.
        - For the operator `==` if the query is on `id` then the only value allowed is an `data exchange ID` of a resource.
        - e.g, `q=attribute-name>attribute-value`

      #### Complex search
      A combination of the above is allowed to make searches more  complex.

      #### Filters
        - A subset of properties of returned documents can be filtered out. This is an option parameter. <br/>For e.g, `pick=[id]` returns documents with only the `id` property retained in them.
        - `minNumberOfAttributes` : 1 and `maxNumberOfAttributes` : 5

      #### Count
        - The <b>count</b> parameter is used for obtaining the <b>number of hits</b> for a query.
        - It should be used along with the <b> valid </b> `complex` queries.
        - The value should be equal to `count` and it is <b>case sensitive</b>
    deprecated: false
