Entity:
  title: Entity
  required:
    - id
  type: object
  properties:
    id:
      type: string
      maxLength: 512
      description: 'A <b> valid data exchange ID </b> of the resource.  <br/> If the resource is a <b> protected resource </b> a <b> valid data exchange Auth token </b> is <b> mandatory </b>  in the header parameter of the request.  <br/> Information about the data exchange ID of the resource and security scope of the resource can be obtained from the <b> DX(Data exchange) catalogue server </b> .'
  example:
    id: 9c0737d6-17df-484f-a7f8-aa472002eae5

GeoQ:
  title: GeoQ
  required:
    - geometry
    - coordinates
    - georel
    - geoproperty
  additionalProperties: false
  type: object
  properties:
    geometry:
      type: string
      enum: [ Point, point, Polygon, polygon, bbox, LineString, linestring ]
      description: >
        The geometry type of <b>geoquery</b> to be performed. <br/>
        This <b>should</b> be one from the available options in the Enum list. <br/>
        The list is <b>case sensitive</b>.
    coordinates:
      oneOf:
        - type: array
          minItems: 2
          maxItems: 2
          items:
            type: number
          description: >
            Used for geometry type <b>Point</b>. Represents a single longitude, latitude pair.
        - type: array
          minItems: 2
          maxItems: 10
          items:
            type: array
            minItems: 2
            maxItems: 2
            items:
              type: number
          description: >
            Used for geometry types <b>LineString</b> and <b>bbox</b>. Each sub-array is a longitude, latitude pair.
        - type: array
          minItems: 1
          maxItems: 1
          items:
            type: array
            minItems: 4
            maxItems: 10
            items:
              type: array
              minItems: 2
              maxItems: 2
              items:
                type: number
          description: >
            Used for geometry type <b>Polygon</b>. A single polygon defined as an array of linear ring coordinates.

    georel:
      type: string
      #          enum: [ near, within, intersects ]
      description: 'The relation type of <b>geoquery</b> to be performed. <br/> This <b>should</b> be one from the available options in the Enum list. <br/> The relation <b> near </b> should be always accomodated with a <b> maxdistance </b> property. <br/> Apart from <b> maxdistance</b> , all other fields in the Enum list are <b> case sensitive </b> fields. <br/> The relation <b> near;maxdistance </b> is applicable only for a <b> point </b>.  <br/> The relation <b> within </b> and  <b> intersects </b> are applicable only for <b> bbox, polygon and linestring</b>.'
    geoproperty:
      type: string
      enum: [ location ]
      description: 'Name of the <b> geospatial </b> property in the <b> DX(Data exchange) data descriptor </b>. <br /> The current version of the API <b> mandates </b> it to be equal to `location`'
  example:
    geometry: Point
    coordinates:
      - 25.319768
      - 82.987988000000001
    georel: near;maxDistance=1000
    geoproperty: geoJsonLocation

GeoQ2:
  title: GeoQ2
  required:
    - geometry
    - coordinates
    - georel
    - geoproperty
  type: object
  properties:
    geometry:
