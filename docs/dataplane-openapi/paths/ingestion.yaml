/ngsi-ld/v1/ingestion/entities:
  post:
    tags:
      - Data Ingestion Adaptor
    summary: Ingestion adapter
    operationId: postIngestionAdaptorEntities
    security:
      - authorization: [ ]

    x-codeSamples:
      - lang: 'cURL'
        label: 'ingestion'
        source: |
          curl --location --request POST 'https://example.com/ngsi-ld/v1/ingestion/entities' \
          --header 'token: <tokenValue>'
          --header 'Content-Type: application/json' \
          --data-raw '<payload>'

    requestBody:
      description: entities is must in all the request
      content:
        application/json:
          schema:
            $ref: '../components/schemas/ingestion.yaml#/ingestionEntityRequest'
      required: true
    responses:
      200:
        description: 'Successful pushed the data'
        content:
          application/json:
            schema:
              $ref: '../components/schemas/ingestion.yaml#/adapterIngestionEntities'


      401:
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/NgsiLdSubscriptionErrorResponse401'

      404:
        description: Not Found
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/NgsiLdSubscriptionErrorResponse404'

      400:
        description: Bad Request
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/NgsiLdSubscriptionErrorResponse400'


    description: |
      Post Ingestion Entities API allows a publish data into DX(Data exchange) Dataplane Server. Based on the input provided, the API validates the access control of the user with DX(Data exchange) Auth server to allow or deny access to the API.

    deprecated: false

/ngsi-ld/v1/ingestion/entities/{id}/on-seek:
  post:
    tags:
      - Data Ingestion Adaptor
    summary: Publish Data Using On-Seek
    operationId: postIngestionAdaptorEntitiesOnSeek
    security:
      - authorization: [ ]

    x-codeSamples:
      - lang: 'cURL'
        label: 'data publish'
        source: |
          curl --location --request POST 'https://example.com/ngsi-ld/v1/ingestion/entities/{id}/on-seek' \
          --header 'token: <tokenValue>'
          --header 'Content-Type: application/json' \
          --data-raw '<payload>'

    requestBody:
      description: Payload of the data to be pushed for a particular id.
      content:
        application/json:
          schema:
            $ref: '../components/schemas/ingestion.yaml#/ingestionEntityRequest2'
      required: true
    parameters:
      - name: id
        in: path
        required: true
        description: 'A <b> valid data exchange ID </b> of the resource. <br/> Information about the data exchange ID of the resource and security scope of the resource can be obtained from the <b> DX(Data exchange) Controlplane server </b> .'
        schema:
          type: string
          format: uuid
    responses:
      200:
        description: 'Successful pushed the data'
        content:
          application/json:
            schema:
              $ref: '../components/schemas/ingestion.yaml#/adapterIngestionEntities'

      401:
