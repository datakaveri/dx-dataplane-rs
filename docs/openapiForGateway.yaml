components:
  schemas:
    postEntitiesSchema:
      type: object
      properties:
        type:
          type: string
          enum:
            - Query
        entities:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                description: A <b> valid data exchange ID </b> of the resource.  <br/>
                  If the resource is a <b> protected resource </b> a <b> valid data
                  exchange Auth token </b> is <b> mandatory </b>  in the header parameter
                  of the request.  <br/> Information about the data exchange ID of
                  the resource and security scope of the resource can be obtained
                  from the <b> DX(Data exchange) catalogue server </b> .
                pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
                maxLength: 36
            required:
              - id
            additionalProperties: false
        geoQ:
          type: object
          properties:
            geometry:
              type: string
              pattern: ^.*$
              enum:
                - point
                - Point
                - polygon
                - Polygon
                - LineString
                - linestring
                - bbox
            coordinates:
              oneOf:
                - type: array
                  maxItems: 2
                  items:
                    type: number
                    default: 0.0
                - type: array
                  items:
                    type: array
                    items:
                      type: array
                      items:
                        type: number
                        default: 0.0
                - type: array
                  items:
                    type: array
                    items:
                      type: number
                      default: 0.0
            georel:
              type: string
              minLength: 1
              maxLength: 1024
              pattern: ^.*$
            geoproperty:
              type: string
              pattern: ^.*$
              enum:
                - location
          additionalProperties: false
        q:
          description: The attribute query is used for querying <b> allowed quantitative</b>
            properties. <br/> Used to query on a value of a resource attribute using
            `<`,`>`,`<=`,`>=`,`!=`, `==` operators. <br/> For e.g, attribute > value,
            attribute < value, attribute >= value, attribute <= value, attribute !=
            value and attribute == value. <br/> Allowed values for all operators is
            double. <br/> For the operator `==` if the query is on `id` then the only
            value allowed is an `data exchange ID` of a resource.
          type: string
          minLength: 1
          maxLength: 512
          pattern: ^.*$
        options:
          type: string
          description: The <b>options</b> parameter is used for obtaining the <b>number
            of hits</b> for a spatial query. <br/> It should be used along with the
            <b> valid temporal query</b> or a <b> valid complex query</b>. <br/> It
            <b>cannot</b> be used along with a <b>attrs</b> filter. The value should
            be equal to `count` and it is <b>case sensitive</b>
          enum:
            - count
        attrs:
          type: string
          description: The attrs parameter is used as an <b>application filter</b>.
            <br/> This is an optional parameter. It can be used to provide the list
            of attributes which the consumer expects to be responded by the server.
            <br/> The consumer is expected to provide <b>only</b> the attributes available
            in the <b>data descriptor</b> of the item in the data exchange Catalogue.
            <br/> Minimum of 1 and a Maximum of 5 attributes can be provided in a
            comma separated fashion.
          maxLength: 512
          minLength: 1
          pattern: ^.*$
      required:
        - entities
        - type
      additionalProperties: false
