        \ `bbox`.\n      - <b>Point</b>: Point and radius query\n          - coordinates:\
        \ Specifies the  center point of the circle, for e.g, `[73,13]`. <br/>Note,\
        \ format is [longitude, latitude]\n          - maxDistance: Specifies the\
        \ Radius from the center point in meters, for e.g `100`. `maxValue` : 1000\n\
        \          - georel: In this version of DX(Data exchange) API, the allowed\
