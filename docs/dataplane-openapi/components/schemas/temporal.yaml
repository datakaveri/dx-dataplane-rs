TemporalQ:
  title: TemporalQ
  required:
    - timerel
    - timeAt
  additionalProperties: false
  type: object
  properties:
    timerel:
      type: string
      enum: [ between, before, after ]
      description: 'The temporal relation type of <b>timerel</b> to be performed. <br/> This <b>should</b> be one from the available options in the Enum list. <br/> If the relation is <b> between </b> it should be always accomodated with a <b> time </b> and <b> endtime </b> property.  <br/> If the relation is <b> before </b> or <b> after </b>it should be always accomodated <b> only</b> with a <b> time </b> property.'
    timeAt:
      type: string
      description: 'This parameter specifies the <b>start time</b> for the temporal-query in `ISO8601` format. <br/> data exchange currently accepts `IST` and `UTC` time zones for the temporal query.'
    endTimeAt:
      type: string
      description: 'This parameter specifies the <b>end time</b> for the temporal-query in `ISO8601` format. <br/> data exchange currently accepts `IST` and `UTC` time zones for the temporal query. <br/>If <b>timerel</b> is `between` time and endtime are mandatory'
    timeproperty:
      type: string
      enum: [ observationDateTime, observedAt ]
  example:
    timerel: between
    timeAt: 2020-06-01T14:20:00Z
    endTimeAt: 2020-06-03T15:00:00Z
    timeproperty: observationDateTime

TemporalQ1:
  title: TemporalQ1
  required:
    - timerel
    - time
    - timeProperty
  type: object
  properties:
    timerel:
      type: string
    time:
      type: string
    timeProperty:
      type: string
  example:
    timerel: before
    time: 2020-06-01T14:20:00Z
    timeProperty: timeProperty

complex-temporal-geo:
  title: complex-geo+time+filterrequest
  required:
    - type
    - entities
    - temporalQ
  additionalProperties: false
  type: object
  properties:
    type:
      type: string
      enum: [ Query ]
    entities:
      type: array
      items:
        $ref: '#/Entity'
      description: ''
    geoQ:
      $ref: '#/GeoQ'
    temporalQ:
      $ref: '#/TemporalQ'
    orderBy:
      type: string
      maxLength: 512
      description: Comma-separated list of properties to orderBy from the response. By default it is `desc`, when it is given only. Could be used with `asc` or `desc` keyword. E.g., `observation:desc,speed:asc`, or `observation,speed:asc`, or `observation:desc,speed`, or `observation,speed`
    q:
      type: string
      maxLength: 512
      description: 'The attribute query is used for querying <b> allowed quantitative</b> properties. <br/> Used to query on a value of a resource attribute using `<`,`>`,`<=`,`>=`,`!=`, `==` operators. <br/> For e.g, attribute > value, attribute < value, attribute >= value, attribute <= value, attribute != value and attribute == value. <br/> Allowed values for all operators is double. <br/> For the operator `==` if the query is on `id` then the only value allowed is an `data exchange ID` of a resource.'
    omit:
      type: string
      maxLength: 512
      description: 'The omit is used as an <b>omit filter</b>. <br/> This is an optional parameter. It can be used to provide the omit of attributes which the consumer expects to be avoided by the server. <br/> The consumer is expected to provide <b>only</b> the attributes available in the <b>data descriptor</b> of the item in the DX(Data exchange) Catalogue. <br/> Minimum of 1 and a Maximum of 5 attributes can be provided in a comma separated fashion.'
    pick:
      type: string
      maxLength: 512
      description: 'The pick is used as an <b>pick filter</b>. <br/> This is an optional parameter. It can be used to provide the pick of attributes which the consumer expects to be responded by the server. <br/> The consumer is expected to provide <b>only</b> the attributes available in the <b>data descriptor</b> of the item in the DX(Data exchange) Catalogue. <br/> Minimum of 1 and a Maximum of 5 attributes can be provided in a comma separated fashion.'
  example:
    type: Query
    entities:
      - id: 9c0737d6-17df-484f-a7f8-aa472002eae5
    geoQ:
      geometry: Point
      coordinates:
        - 25.319768
        - 82.987988000000001
      georel: near;maxDistance=1000
      geoproperty: geoJsonLocation
    temporalQ:
      timerel: between
      timeAt: 2020-06-01T14:20:00Z
      endTimeAt: 2020-06-03T15:00:00Z
      timeproperty: observationDateTime

