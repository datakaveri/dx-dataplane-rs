                  \ exchange Auth token ** is ** mandatory **  in the header parameter\
                  \ of the request.  \n Information about the data exchange ID of\
                  \ the resource and security scope of the resource can be obtained\
                  \ from the ** DX(Data exchange) catalogue server ** ."
                pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
                maxLength: 36
            required:
              - id
            additionalProperties: false
        geoQ:
          type: object
          properties:
            geometry:
              type: string
              pattern: ^.*$
              enum:
                - point
