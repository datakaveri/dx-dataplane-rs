        \ combination of the above is allowed to make searches more  complex.\n\n\
        #### Filters\n  - A subset of properties of returned documents can be filtered\
        \ out. This is an option parameter. <br/>For e.g, `attrs=[id]` returns documents\
        \ with only the `id` property retained in them. \n  - `minNumberOfAttributes`\
        \ : 1 and `maxNumberOfAttributes` : 5 \n\n#### Options\n  - The <b>options</b>\
        \ parameter is used for obtaining the <b>number of hits</b> for a query. \n\
        \  - It should be used along with the <b> valid </b> `temporal`, or `complex`\
        \ queries. \n  - It <b>cannot</b> be used along with a <b>attrs</b> filter.\
        \ \n  - The value should be equal to `count` and it is <b>case sensitive</b>\n"
