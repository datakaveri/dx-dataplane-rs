        \ ** within ** and  ** intersects ** are applicable only for ** bbox, polygon\
        \ and linestring**.\n\n  - **geometry**:  \n      - Specifies the GeoJson\
        \ geometries. \n      - Should be One of `Point`(equivalent for a circle),\
        \ `Polygon`, `LineString`, `bbox`.\n      - **Point**: Point and radius query\n\
        \          - coordinates: Specifies the  center point of the circle, for e.g,\
