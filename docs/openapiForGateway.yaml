  parameters:
    AuthorizationHeader:
      name: Authorization
      in: header
      description: A <b> valid data exchange Auth token </b> to process the request.
        <br/> This field is <b> mandatory </b> for accessing a <b> resource </b> .  <br/>
        If not provided with a valid token, user will be responded with <b> 401 Unauthorized
        </b> .
      required: false
      schema:
        type: string
    IdParam:
      name: id
      in: query
      description: A <b> valid data exchange ID </b> of the resource. <br/> Information
        about the data exchange ID of the resource and security scope of the resource
        can be obtained from the <b> DX(Data exchange) catalogue server </b> .
      required: true
      schema:
        type: string
        format: uuid
        maxLength: 36
    GeoPropertyParam:
      name: geoproperty
      in: query
      description: Name of the <b> geospatial </b> property in the <b> DX(Data exchange)
        data descriptor </b>. <br /> The current version of the API <b> mandates </b>
        it to be equal to `location`
      schema:
        type: string
        enum:
          - location
    GeoRelParam:
      name: georel
      in: query
      description: 'The relation type of geoquery to be performed.  Examples:  - `near;maxDistance==1000`
        (valid only with Point)  - `within`  - `intersects`'
      schema:
        type: string
        pattern: ^(near(;.*)?|within|intersects)$
        example: near;maxDistance==1000
    GeometryParam:
      name: geometry
      in: query
      description: 'The geometry type of <b>geoquery</b> to be performed. <br/> This
        <b>should</b> be one from the available options in the Enum list. <br/>The
        list is <b>case sensitive</b> '
      schema:
        type: string
        enum:
          - Point
          - point
          - Polygon
          - polygon
          - LineString
          - linestring
          - bbox
    CoordinatesParam:
      name: coordinates
      in: query
      description: 'The coordinates for a specific geometry query type. <br/> This
        parameter accepts both <b> one dimentional array and multi dimentional arrays
        </b> based on the <b> geometry</b> type. <br/> For e.g, [longitude-1,latitude-1]
        should be used for geometry <b>point</b>.  <br/>[[[longitude-1,latitude-1],
        [longitude-2,latitude-2],...., [longitude-n,latitude-n]]] should be used for
        geometry <b>polygon</b>. <br/> [[longitude-1,latitude-1], [longitude-2,latitude-2],....,
        [longitude-n,latitude-n]] should be used for geometry <b>bbox and linestring
        </b>. <br/> Maximum of 10 latitude, longitude pairs can be used for geometry
        <b>polygon, bbox and linestring </b>. <br/> Note: The data-type of this field
        is a string, therefore the coordinates are a string encoded multidimensional
        array. <br/> Maximum precision allowed is upto 6 decimal places.'
      schema:
        type: string
    MaxDistanceParam:
      name: maxDistance
      in: query
      description: The maximum distance to be queried from center point in meters.
        <br/> This is applicable and is <b>mandatory</b> for <b>point</b> geometry.<br/>
        It should be used along with relation <b>near</b>.
      schema:
        type: number
        minimum: 0
        maximum: 1000
    QParam:
      name: q
      in: query
      description: The attribute query is used for querying <b> allowed quantitative</b>
        properties. <br/> Used to query on a value of a resource attribute using `<`,`>`,`<=`,`>=`,`!=`,
        `==` operators. <br/> For e.g, attribute > value, attribute < value, attribute
        >= value, attribute <= value, attribute != value and attribute == value. <br/>
        Allowed values for all operators is double. <br/> For the operator `==` if
        the query is on `id` then the only value allowed is an `data exchange ID`
        of a resource.
      schema:
        type: string
        maxLength: 512
    AttrsParam:
      name: attrs
      in: query
      description: The attrs parameter is used as an <b>application filter</b>. <br/>
        This is an optional parameter. It can be used to provide the list of attributes
        which the consumer expects to be responded by the server. <br/> The consumer
        is expected to provide <b>only</b> the attributes available in the <b>data
        descriptor</b> of the item in the DX(Data exchange) Catalogue. <br/> Minimum
        of 1 and a Maximum of 5 attributes can be provided in a comma separated fashion.
      schema:
        type: string
        maxLength: 512
        minLength: 1
    OptionsParam:
      name: options
      in: query
      description: The <b>options</b> parameter is used for obtaining the <b>number
        of hits</b> for a query. <br/> It should be used along with the <b> valid
        </b> `spatial`, `attribute` or `complex` queries. <br/> It <b>cannot</b> be
        used along with a <b>attrs</b> filter. The value should be equal to `count`
        and it is <b>case sensitive</b>
      schema:
        type: string
        enum:
          - count
    TimerelParam:
      name: timerel
      in: query
      description: The temporal relation type of <b>timerel</b> to be performed.
      schema:
        type: string
        enum:
          - between
          - before
          - after
          - during
    TimeParam:
      name: time
      in: query
      description: This parameter specifies the <b>start time</b> for the temporal-query
        in `ISO8601` format. <br/> data exchange currently accepts `IST` and `UTC`
        time zones for the temporal query.
      schema:
        type: string
    EndtimeParam:
      name: endtime
      in: query
      description: This parameter specifies the <b>end time</b> for the temporal-query
        in `ISO8601` format. <br/> data exchange currently accepts `IST` and `UTC`
        time zones for the temporal query. <br/>If <b>timerel</b> is `between` time
        and endtime are mandatory
      schema:
        type: string
    FormatHeader:
      name: format
      in: header
      description: format in header could be added to get the response in required
        encoding through `/async/status` API
      schema:
        type: string
        enum:
          - json
          - csv
    SearchIdParam:
      name: searchId
      in: query
      description: searchId returned while submitting request through `/async/search`
      required: true
      schema:
        type: string
        maxLength: 512
  requestBodies:
    PostEntitiesRequest:
      description: Post entities query request
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/postEntitiesSchema'
    PostTemporalRequest:
