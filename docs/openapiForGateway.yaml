openapi: 3.0.2
info:
  title: Data exchange Resource Server Proxy APIs
  version: 5.6.0
  description: "# Introduction\nThe Resource Proxy Server is DXs'(Data Exchange) data\
    \ discovery portal.\nThe consumers can access data from the resource server proxy\
    \ using HTTPs.\nIt supports Complex (Temporal + Attribute), Temporal (Before,\
    \ during, After) and Attribute searches.\nIt integrates with authorization server\
    \ (token introspection) to serve private data as per the access control policies\
    \ set by the provider\nIt secures data access over TLS\n\n\n# Configurations\n\
    - **Server**: \n  - In the doc, we display the server url to be https://example-proxy.com\
    \ with the hostname as example-proxy.com\n  - This could be configured according\
    \ to the deployment\n- **Base path**:\n  - Base path is the path on which API\
    \ is served, relative to the host\n  - It is the initial part of the API\n  -\
    \ These base path values could be configured according to the deployment\n  -\
    \ The base path for [DX AAA Server](https://github.com/datakaveri/iudx-aaa-server)\
    \ is set to `/auth/v1`\n  - The base path for [DX Catalogue Server](https://github.com/datakaveri/iudx-catalogue-server)\
    \ is set to `/iudx/cat/v1`\n      Currently, the following APIs have `/ngsi-ld/v1`\
    \ base path\n      -  /entities\n      -  /temporal/entities\n      -  /temporal/entityOperations/query\n\
    \      -  /entityOperations/query\n      -  /async/search\n      -  /async/status\n\
    \      <br>\n- **Request Samples**:\n  - The `<tokeValue>` in the header of request\
    \ sample could be replaced with respective token value [Also refer Tokens section\
    \ [here](#section/Tokens)]\n  - The `<publicKeyValue>` in the header of request\
    \ sample could be replaced with the respective public key [Also refer Encryption\
    \ section [here](#section/Encryption)]\n  - The `<payload>` in the request sample\
    \ could be replaced with the payload given adjacent to the request sample\n\n\n\
    # Tokens\nAll the <b>*Search API*</b>  calls to the resource server proxy should\
    \ now contain a valid data exchange auth token presented in the query header.\
    \ To search (or) access an *Open* resource, the consumer should present a valid\
    \ data exchange Auth token. To search (or) access a *Secure / Closed* resource,\
    \ a consumer must get a token for the *Secure / Closed* resource along with the\
    \ associated constraints from the DX(Data exchange) Auth Server. For subscription\
    \ to a *Secure / Closed / Open* resource, a consumer must get a token along with\
    \ the associated constraints from the DX(Data exchange) Auth Server.\n\n# Pagination\n\
    Resource server proxy also offers way to paginate the result for queries. If a\
    \ query returns large number of records then user can use additional parameters\
    \ in query parameters to limit numbers of records to be returned.\n\n- <b> Pagination\
    \ is applicable only for</b>\n   - <b>/entities</b>\n   - <b>/temporal/entities</b>\n\
    \   - <b>/temporal/entityOperations/query</b>\n   - <b>/entityOperations/query</b>\n\
    \   - <b>/consumer/audit</b>\n   - <b>/provider/audit</b>\n\nAdditional query\
    \ parameters to be used:\n  - <b>offset</b> : The from parameter defines the offset\
    \ from the first result you want to fetch,  ( <i>default : 0</i> ,<i>minValue:\
    \ 0</i>, <i>maxValue: 49999</i> )\n  - <b>limit</b> : The size parameter allows\
    \ you to configure the maximum results to be returned  ( <i>default: 5000</i>\
    \ ,<i>minValue: 0</i>, <i>maxValue: 5000</i> )\n\n# Encryption\nAll the count\
    \ and search APIs have a feature to get encrypted data.\nTo get the data in encrypted\
    \ format, the user could provide a `publicKey` in the header. \nThe header value\
    \ should be in _url-safe base64 format_. \n\n**Encryption is applicable only for**\n\
    -  **/entities**\n-  **/temporal/entities**\n-  **/temporal/entityOperations/query**\n\
    -  **/entityOperations/query**\n\n\n# API HTTP Responses\nApart from the response\
    \ codes specified in each API, the API server may respond with certain 4xx and\
    \ 5xx error codes which are related to common API Gateway behaviours.\nThe application\
    \ should address them accordingly.\n"
  contact:
    name: For support contact IUDX Team at
    email: support@cdpg.org.in
    url: https://dataforpublicgood.org.in/
  license:
    name: Apache 2.0
tags:
  - name: Spatial Entities
    x-displayName: Spatial Search
    description: 'A Spatial Search is used by DX(Data exchange) Data *Consumers* for
    querying a resource using a <b>valid data exchange</b> `id`, `spatial` and `attribute`
    parameters. <br/> Information about the data exchange ID of the resource and security
    scope of the resource can be obtained from the <b> DX(Data exchange) catalogue
    server </b>. <br/> You can use this API to make a `spatial` or `attribute` or
    `complex : spatial+attribute` query.

    '
  - name: Temporal Entities
    x-displayName: Temporal and Complex Search
    description: 'A Temporal Search is used by DX(Data exchange) Data *Consumers* for
    querying a resource using a <b>valid data exchange</b> `id`, `temporal`, `spatial`
    and `attribute` parameters. <br/> Information about the data exchange ID of the
    resource and security scope of the resource can be obtained from the <b> DX(Data
    exchange) catalogue server </b>. <br/>In order to use this API, a `temporal` parameter
    is <b>mandatory</b>. <br/> You can use this API to make a `temporal` or `complex
    : temporal+spatial` or `complex : temporal+attribute` or `complex : temporal+spatial+attribute`
    query. <br/> If you are looking for an `attribute` only query refer the <b>Spatial
    Search</b> `/entities` endpoint.

    '
  - name: Entities Post Query
    x-displayName: Complex Search (Post Query)
    description: 'A Complex Search (Post Query) is an HTTP POST API and is used by DX(Data
    exchange) Data *Consumers*. <br/>This API is used for querying a resource using
    a <b>valid data exchange</b> `id`, `temporal`, `spatial` and `attribute` parameters.
    <br/> Information about the data exchange ID of the resource and security scope
    of the resource can be obtained from the <b> DX(Data exchange) catalogue server
    </b>. <br/> You can use this API to make a `temporal` or `spatial` or `attribute`
    or `complex : temporal+spatial` or `complex : temporal+attribute` or `complex
    : spatial+attribute` or `complex : temporal+spatial+attribute` query.

    '
  - name: Async
    x-display: Async
    description: 'Async APIs provide the ability to the user to query resources using
    larger temporal period and greater spatial area.

    '
servers:
  - url: https://example-proxy.com
    description: Development Server URL
paths:
  /ngsi-ld/v1/entities:
    get:
      tags:
        - Spatial Entities
      operationId: get-Spatial-Search
      parameters:
        - $ref: '#/components/parameters/AuthorizationHeader'
        - $ref: '#/components/parameters/IdParam'
        - $ref: '#/components/parameters/GeoPropertyParam'
        - $ref: '#/components/parameters/GeoRelParam'
        - $ref: '#/components/parameters/GeometryParam'
        - $ref: '#/components/parameters/CoordinatesParam'
        - $ref: '#/components/parameters/MaxDistanceParam'
        - $ref: '#/components/parameters/QParam'
        - $ref: '#/components/parameters/AttrsParam'
        - $ref: '#/components/parameters/OptionsParam'
      responses:
        200:
          description: Successful query
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/entityresponse'
        204:
          description: Empty Response
        400:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/standardBadRequestErrorResponse'
          description: Bad query
        401:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/standardInvalidTokenErrorResponse'
          description: Unauthorized
        404:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/standardResourceNotFoundErrorResponse'
          description: Resource not found
      x-codeSamples:
        - lang: cURL
          label: search by attribute
          source: 'curl --location --request GET ''https://example-proxy.com/ngsi-ld/v1/entities?id=UUID&q=referenceLevel>15.0''
          \

          --header ''token: <tokenValue>''

          '
        - lang: cURL
          label: get encrypted data
          source: 'curl --location -g --request GET ''https://example-proxy.com/ngsi-ld/v1/entities?id=UUID&geoproperty=location&georel=near;maxdistance=10&geometry=Point&coordinates=[21.178,72.834]&offset=0&limit=10''
          \

          --header ''token: <tokenValue>'' \

          --header ''publicKey: <publicKeyValue>''

          '
        - lang: cURL
          label: search by circle
          source: 'curl --location -g --request GET ''https://example-proxy.com/ngsi-ld/v1/entities?id=UUID&geoproperty=location&georel=near;maxdistance=10&geometry=Point&coordinates=[21.178,72.834]&offset=0&limit=10''
          \

          --header ''token: <tokenValue>''

          '
        - lang: cURL
          label: search by polygon
          source: 'curl --location -g --request GET ''https://example-proxy.com/ngsi-ld/v1/entities?id=UUID&geoproperty=location&georel=within&geometry=Polygon&coordinates=[[[72.76,21.15],[72.76,21.13],[72.78,21.13],[72.78,21.15],[72.76,21.15]]]''
          \

          --header ''token: <tokenValue>''

          '
        - lang: cURL
          label: search by bbox
          source: 'curl --location -g --request GET ''https://example-proxy.com/ngsi-ld/v1/entities?id=UUID&geoproperty=location&georel=within&geometry=bbox&coordinates=[[72.8296,21.2],[72.8297,21.15]]''
          \

          --header ''token: <tokenValue>''

          '
        - lang: cURL
          label: search by linestring
          source: 'curl --location -g --request GET ''https://example-proxy.com/ngsi-ld/v1/entities?id=UUID&geoproperty=location&georel=intersects&geometry=linestring&coordinates=[[72.84,21.19],[72.84,21.17]]''
          \

          --header ''token: <tokenValue>''

          '
        - lang: cURL
          label: search by attribute and filter
          source: 'curl --location --request GET ''https://example-proxy.com/ngsi-ld/v1/entities?id=UUID&q=referenceLevel>15.0&attrs=id,currentLevel,referenceLevel''
          \

          --header ''token: <tokenValue>''

          '
        - lang: cURL
          label: count by circle
          source: 'curl --location -g --request GET ''https://example-proxy.com/ngsi-ld/v1/entities?id=UUID&geoproperty=location&georel=near;maxDistance=10&geometry=Point&coordinates=[21.178,72.834]&options=count''
          \

          --header ''token: <tokenValue>''

          '
      deprecated: false
      description: "The `/entities` end point allows a consumer to query on data published\
        \ based on a <b>spatial</b> and <b>attribute</b> properties. The <b>spatial</b>\
        \ queries should be submitted as a geo json as described in the API. All the\
        \ queries requires a <b> valid data exchange </b> `id` of the resource. These\
        \ apis are intended to be used by DX(Data exchange) Data *Consumers*.\n\n\
        \  - <b>Allowed Search Operations</b>: \n      - <b> Spatial (Geo) Search\
        \ : </b> which queries the geo property of the resource.\n      - <b> Attribute\
        \ Search : </b> which queries the valid attributes as per the data descriptor.\n\
        \      - <b> Complex Search : </b> which queries using the combination of\
        \ the above two.\n\n\n#### Spatial (Geo) Search\nGeo search accepts geojson\
        \ based queries. The params and their accepted values are briefed below -\n\
        \  - <b>geoproperty</b>: \n      - Specifies the name of the <b> geospatial\
        \ </b> property in the <b> DX(Data exchange) data descriptor </b>.\n     \
        \ - The current version of the API <b> mandates </b> it to be equal to `location`\n\
        \  - <b>georel</b>:   \n      - Specifies the spatial relationship to be queried.\n\
        \      - The relation type of <b>geoquery</b> can be <b>one of</b> `near;maxdistance=<distance_in_meters>`,\
        \ `within`, `intersects`.\n      - The relation <b> near </b> should be always\
        \ accomodated with a <b> maxdistance </b> property.\n      - Apart from <b>\
        \ maxdistance</b> , all other fields in the Enum list are <b> case sensitive\
        \ </b> fields.\n      - The relation <b> near;maxdistance </b> is applicable\
        \ only for a <b> point </b>.\n      - The relation <b> within </b> and  <b>\
        \ intersects </b> are applicable only for <b> bbox, polygon and linestring</b>.\n\
        \n  - <b>geometry</b>:  \n      - Specifies the GeoJson geometries. \n   \
        \   - Should be One of `Point`(equivalent for a circle), `Polygon`, `LineString`,\
        \ `bbox`.\n      - <b>Point</b>: Point and radius query\n          - coordinates:\
        \ Specifies the  center point of the circle, for e.g, `[73,13]`. <br/>Note,\
        \ format is [longitude, latitude]\n          - maxDistance: Specifies the\
        \ Radius from the center point in meters, for e.g `100`. `maxValue` : 1000\n\
        \          - georel: In this version of DX(Data exchange) API, the allowed\
        \ relationship search for a circle is `near` with a `maxdistance` in meters\
        \ specified. This will be equivalent to a `within` query. Format is `near;maxdistance=<distance_in_meters>`\
        \ \n      - <b>Polygon</b>: Polygon/Multi-Polygon query\n          - coordinates:\
        \ Specifies the  coordinates of the polygon, for e.g, `[[[73,13],[73,12],[73,13]]]`.\
        \  <br/>Note, format is [longitude, latitude] and the first coordinate must\
        \ be same as last. \n          - `minNumberOfCoOrdinates` : 4 and `maxnNumberOfCoOrdinates`\
        \ : 10\n          - georel: `within`, `intersects`\n      - <b>LineString</b>:\
        \ Multi line string\n          - coordinates: Specifies the coordinates of\
        \ the multi-line, for e.g, `[[73,13],[74,15],[75,16]]`. <br/>Note, format\
        \ is [longitude, latitude]\n          - `minNumberOfCoOrdinates` : 2 and `maxnNumberOfCoOrdinates`\
        \ : 10\n          - georel:  `within`, `intersects`\n      - <b>bbox</b>:\
        \ Bounding box\n          - coordinates: `[[top-left],[bottom-right]]`. e.g,\
        \ `[[73,13],[74,12]]`. <br/>Note, format is [longitude, latitude].\n     \
        \     - georel:  `within`, `intersects`\n\n#### Attribute search\nThe attribute\
        \ query is used for querying <b> allowed quantitative</b> properties. \n \
        \ - Used to query on a value of a resource attribute using `<`,`>`,`<=`,`>=`,`!=`,`==`\
        \ operators. \n  - For e.g, attribute > value, attribute < value, attribute\
        \ >= value, attribute <= value and attribute == value. \n  - Allowed values\
        \ for all operators is double. \n  - For the operator `==` if the query is\
        \ on `id` then the only value allowed is an `data exchange ID` of a resource.\
        \ \n  - e.g, `q=attribute-name>attribute-value`\n\n#### Complex search\nA\
        \ combination of the above is allowed to make searches more  complex.\n\n\
        #### Filters\n  - A subset of properties of returned documents can be filtered\
        \ out. This is an option parameter. <br/>For e.g, `attrs=[id]` returns documents\
        \ with only the `id` property retained in them. \n  - `minNumberOfAttributes`\
        \ : 1 and `maxNumberOfAttributes` : 5 \n\n#### Options\n  - The <b>options</b>\
        \ parameter is used for obtaining the <b>number of hits</b> for a query. \n\
        \  - It should be used along with the <b> valid </b> `spatial`, `attribute`\
        \ or `complex` queries. \n  - It <b>cannot</b> be used along with a <b>attrs</b>\
        \ filter. \n  - The value should be equal to `count` and it is <b>case sensitive</b>\n"
  /ngsi-ld/v1/temporal/entities:
    get:
      tags:
        - Temporal Entities
      summary: Temporal Search
      operationId: get-temporal-entity-search
      parameters:
        - $ref: '#/components/parameters/AuthorizationHeader'
        - $ref: '#/components/parameters/IdParam'
        - $ref: '#/components/parameters/TimerelParam'
        - $ref: '#/components/parameters/TimeParam'
        - $ref: '#/components/parameters/EndtimeParam'
        - $ref: '#/components/parameters/GeoPropertyParam'
        - $ref: '#/components/parameters/GeoRelParam'
        - $ref: '#/components/parameters/GeometryParam'
        - $ref: '#/components/parameters/CoordinatesParam'
        - $ref: '#/components/parameters/MaxDistanceParam'
        - $ref: '#/components/parameters/QParam'
        - $ref: '#/components/parameters/AttrsParam'
        - $ref: '#/components/parameters/OptionsParam'
      responses:
        200:
          description: Successful query
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/entityresponse'
        204:
          description: Empty Response
        400:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/standardBadRequestErrorResponse'
          description: Bad query
        401:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/standardInvalidTokenErrorResponse'
          description: Unauthorized
        404:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/standardResourceNotFoundErrorResponse'
          description: Resource not found
      x-codeSamples:
        - lang: cURL
          label: search by between
          source: 'curl --location --request GET ''https://example-proxy.com/ngsi-ld/v1/temporal/entities?id=UUID&timerel=during&time=2020-10-18T14:20:00Z&endtime=2020-10-19T14:20:00Z''
          \

          --header ''token: <tokenValue>''

          '
        - lang: cURL
          label: get encrypted data
          source: 'curl --location --request GET ''https://example-proxy.com/ngsi-ld/v1/temporal/entities?id=UUID&timerel=during&time=2020-10-18T14:20:00Z&endtime=2020-10-19T14:20:00Z''
          \

          --header ''token: <tokenValue>'' \

          --header ''publicKey: <publicKeyValue>''

          '
        - lang: cURL
          label: search by before
          source: 'curl --location --request GET ''https://example-proxy.com/ngsi-ld/v1/temporal/entities?id=UUID&timerel=before&time=2020-10-19T12:00:00Z''
          \

          --header ''token: <tokenValue>''

          '
        - lang: cURL
          label: search by after
          source: 'curl --location --request GET ''https://example-proxy.com/ngsi-ld/v1/temporal/entities?id=UUID&timerel=after&time=2020-10-18T14:20:01Z''
          \

          --header ''token: <tokenValue>''

          '
        - lang: cURL
          label: search by between and filter
          source: "curl --location --request GET 'https://example-proxy.com/ngsi-ld/v1/temporal/entities?id=UUID&timerel=between&time=2020-10-18T14:20:00Z&endtime=2020-10-19T14:20:00Z&attrs=id,currentLevel,referenceLevel'\
          \ \\\n--header 'token: <tokenValue>'        \n"
        - lang: cURL
          label: count by after
          source: 'curl --location --request GET ''https://example-proxy.com/ngsi-ld/v1/temporal/entities?id=UUID&timerel=after&time=2020-10-18T14:20:01Z&options=count''
          \

          --header ''token: <tokenValue>''

          '
        - lang: cURL
          label: complex search
          source: 'curl --location -g --request GET ''https://example-proxy.com/ngsi-ld/v1/temporal/entities?id=UUID&geoproperty=location&georel=near;maxDistance=10&geometry=Point&coordinates=[21.178,72.834]&timerel=before&time=2020-10-19T14:00:00Z&attrs=id,location,speed''
          \

          --header ''token: <tokenValue>''

          '
        - lang: cURL
          label: complex count
          source: 'curl --location -g --request GET ''https://example-proxy.com/ngsi-ld/v1/temporal/entities?id=UUID&geoproperty=location&georel=near;maxDistance=10&geometry=Point&coordinates=[21.178,72.834]&timerel=before&time=2020-10-19T14:00:00Z&options=count''
          \

          --header ''token: <tokenValue>''

          '
      deprecated: false
      description: "The `/temporal/entities` end point allows a consumer to query\
        \ on data published based on a <b>spatial</b>, <b>temporal</b> and <b>attribute</b>\
        \ properties. The <b>spatial</b> queries should be submitted as a geo json\
        \ as described in the API. All the queries requires a <b> valid data exchange</b>\
        \ `id`  of the resource and a `temporal` parameter. These apis are intended\
        \ to be used by DX(Data exchange) Data *Consumers*.\n\n  - <b>Allowed Search\
        \ Operations</b>: \n      - <b> Temporal Search : </b> which queries the temporal\
        \ property of the resource.\n      - <b> Spatial (Geo) Search : </b> which\
        \ queries the geo property of the resource.\n      - <b> Attribute Search\
        \ : </b> which queries the valid attributes as per the data descriptor.\n\
        \      - <b> Complex Search : </b> which queries using the combination of\
        \ the above three.\n\n#### Temporal search\nTemporal search accepts time property\
        \ based queries which are specified in ISO 8601 format. The params and their\
        \ accepted values are -\n  - <b>timerel</b>: The time relation of the query.\
        \ Should be either `between`, `before` or `after`. The value `during` could\
        \ also be used instead of `between`.\n  - <b>time</b>: Start time for the\
        \ temporal query in `ISO 8601` format. \n  - <b>endtime</b>: End time for\
        \ the temporal query in `ISO 8601` format. Applicable only for `timerel =\
        \ between`. \n  - Note, The time difference between `time` and `endtime` should\
        \ be less than `10 days`. For `before` and `after` queries, `10 days` of data\
        \ `before` or `after` the specified time will be provided.\n\n\n#### Spatial\
        \ (Geo) Search\nGeo search accepts geojson based queries. The params and their\
        \ accepted values are briefed below -\n  - <b>geoproperty</b>: \n      - Specifies\
        \ the name of the <b> geospatial </b> property in the <b> DX(Data exchange)\
        \ data descriptor </b>.\n      - The current version of the API <b> mandates\
        \ </b> it to be equal to `location`\n  - <b>georel</b>:   \n      - Specifies\
        \ the spatial relationship to be queried.\n      - The relation type of <b>geoquery</b>\
        \ can be <b>one of</b> `near;maxdistance=<distance_in_meters>`, `within`,\
        \ `intersects`.\n      - The relation <b> near </b> should be always accomodated\
        \ with a <b> maxdistance </b> property.\n      - Apart from <b> maxdistance</b>\
        \ , all other fields in the Enum list are <b> case sensitive </b> fields.\n\
        \      - The relation <b> near;maxdistance </b> is applicable only for a <b>\
        \ point </b>.\n      - The relation <b> within </b> and  <b> intersects </b>\
        \ are applicable only for <b> bbox, polygon and linestring</b>.\n\n  - <b>geometry</b>:\
        \  \n      - Specifies the GeoJson geometries. \n      - Should be One of\
        \ `Point`(equivalent for a circle), `Polygon`, `LineString`, `bbox`.\n   \
        \   - <b>Point</b>: Point and radius query\n          - coordinates: Specifies\
        \ the  center point of the circle, for e.g, `[73,13]`. <br/>Note, format is\
        \ [longitude, latitude]\n          - maxDistance: Specifies the Radius from\
        \ the center point in meters, for e.g `100`. `maxValue` : 1000\n         \
        \ - georel: In this version of DX(Data exchange) API, the allowed relationship\
        \ search for a circle is `near` with a `maxdistance` in meters specified.\
        \ This will be equivalent to a `within` query. Format is `near;maxdistance=<distance_in_meters>`\
        \ \n      - <b>Polygon</b>: Polygon/Multi-Polygon query\n          - coordinates:\
        \ Specifies the  coordinates of the polygon, for e.g, `[[[73,13],[73,12],[73,13]]]`.\
        \  <br/>Note, format is [longitude, latitude] and the first coordinate must\
        \ be same as last. \n          - `minNumberOfCoOrdinates` : 4 and `maxnNumberOfCoOrdinates`\
        \ : 10\n          - georel: `within`, `intersects`\n      - <b>LineString</b>:\
        \ Multi line string\n          - coordinates: Specifies the coordinates of\
        \ the multi-line, for e.g, `[[73,13],[74,15],[75,16]]`. <br/>Note, format\
        \ is [longitude, latitude]\n          - `minNumberOfCoOrdinates` : 2 and `maxnNumberOfCoOrdinates`\
        \ : 10\n          - georel:  `within`, `intersects`\n      - <b>bbox</b>:\
        \ Bounding box\n          - coordinates: `[[top-left],[bottom-right]]`. e.g,\
        \ `[[73,13],[74,12]]`. <br/>Note, format is [longitude, latitude].\n     \
        \     - georel:  `within`, `intersects`\n\n#### Attribute search\nThe attribute\
        \ query is used for querying <b> allowed quantitative</b> properties. \n \
        \ - Used to query on a value of a resource attribute using `<`,`>`,`<=`,`>=`,`!=`,\
        \ `==` operators. \n  - For e.g, attribute > value, attribute < value, attribute\
        \ >= value, attribute <= value and attribute == value. \n  - Allowed values\
