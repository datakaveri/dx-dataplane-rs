/admin/elasticsearch/createIndex:
  post:
    tags:
      - Admin
    summary: Onboard dataset index into Elasticsearch
    description: Creates an Elasticsearch index using provided `indexName` and `dataDescriptor` (mappings).
    operationId: onboardElasticsearchIndex
    security:
      - authorization: [ ]
    parameters:
      - name: dynamic
        in: query
        required: false
        description: >
          How the new index treats fields the dataDescriptor does not declare.
          `true` adds them to the mapping with a guessed type; `false` stores them
          in _source but indexes nothing; `strict` rejects the whole document.
        schema:
          type: string
          enum: [ "true", "false", "strict" ]
          default: "strict"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - dataDescriptor
            properties:
              id:
                type: string
                description: Dataset ID; final index will be TENANT__ID
              dataDescriptor:
                type: object
                properties:
                  refNumber:
                    type: object
                    description: Elasticsearch index mappings object
    responses:
      '201':
        description: Index created
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                  example: dx:dataplane:success
                title:
                  type: string
                  example: Created
                detail:
                  type: string
                  example: Index created successfully
      '409':
        description: Index Already Exist
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/generalResourceAlreadyExistErrorResponse'

      '400':
        description: Invalid request
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/standardBadRequestErrorResponse'
