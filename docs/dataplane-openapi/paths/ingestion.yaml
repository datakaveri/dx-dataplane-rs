/ngsi-ld/v1/ingestion/entities:
  post:
    tags:
      - Data Ingestion Adaptor
    summary: Ingestion adapter
    operationId: postIngestionAdaptorEntities
    security:
      - authorization: [ ]

    x-codeSamples:
      - lang: 'cURL'
        label: 'single record'
        source: |
          curl --location --request POST 'https://example.com/ngsi-ld/v1/ingestion/entities' \
          --header 'Authorization: Bearer <tokenValue>' \
          --header 'Content-Type: application/json' \
          --data-raw '{
            "entities": "695e222b-3fae-4325-8db0-3e29d01c4fc0",
            "observationDateTime": "2020-09-22T18:30:00+05:30",
            "currentLevel": 1.16,
            "referenceLevel": 15.9,
            "measuredDistance": 14.74,
            "deviceInfo": {
              "deviceID": "FWR055"
            }
          }'
      - lang: 'cURL'
        label: 'multiple records'
        source: |
          curl --location --request POST 'https://example.com/ngsi-ld/v1/ingestion/entities' \
          --header 'Authorization: Bearer <tokenValue>' \
          --header 'Content-Type: application/json' \
          --data-raw '[
            {
              "entities": "695e222b-3fae-4325-8db0-3e29d01c4fc0",
              "observationDateTime": "2020-09-22T18:30:00+05:30",
              "currentLevel": 1.16,
              "measuredDistance": 14.74,
              "deviceInfo": {
                "deviceID": "FWR055"
              }
            },
            {
              "entities": "695e222b-3fae-4325-8db0-3e29d01c4fc0",
              "observationDateTime": "2020-09-22T18:35:00+05:30",
              "currentLevel": 1.21,
              "measuredDistance": 14.69,
              "deviceInfo": {
                "deviceID": "FWR055"
              }
            }
          ]'

    requestBody:
      description: |
        A single record or an array of records. `entities` is mandatory in every record and must
        hold the same resource id across the whole request.
      content:
        application/json:
          schema:
            $ref: '../components/schemas/ingestion.yaml#/ingestionEntityRequest'
          examples:
            singleRecord:
              summary: one record
              value:
                entities: "695e222b-3fae-4325-8db0-3e29d01c4fc0"
                observationDateTime: "2020-09-22T18:30:00+05:30"
                currentLevel: 1.16
                referenceLevel: 15.9
                measuredDistance: 14.74
                deviceInfo:
                  deviceID: "FWR055"
            multipleRecords:
              summary: many records for the same resource
              value:
                - entities: "695e222b-3fae-4325-8db0-3e29d01c4fc0"
                  observationDateTime: "2020-09-22T18:30:00+05:30"
                  currentLevel: 1.16
                  measuredDistance: 14.74
                  deviceInfo:
                    deviceID: "FWR055"
                - entities: "695e222b-3fae-4325-8db0-3e29d01c4fc0"
                  observationDateTime: "2020-09-22T18:35:00+05:30"
                  currentLevel: 1.21
                  measuredDistance: 14.69
                  deviceInfo:
                    deviceID: "FWR055"
      required: true
    responses:
      200:
        description: 'Successful pushed the data'
        content:
          application/json:
            schema:
              $ref: '../components/schemas/ingestion.yaml#/adapterIngestionEntities'


      401:
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/NgsiLdSubscriptionErrorResponse401'

      404:
        description: Not Found
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/NgsiLdSubscriptionErrorResponse404'

      400:
        description: Bad Request
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/NgsiLdSubscriptionErrorResponse400'


    description: |
      Post Ingestion Entities API allows a publish data into DX(Data exchange) Dataplane Server. Based on the input provided, the API validates the access control of the user with DX(Data exchange) Auth server to allow or deny access to the API.

      The body may be a single record or an array of records. `entities` carries the id of the
      resource the record belongs to and must be identical in every record of one request. Records
      are forwarded to the broker in chunks, so large arrays need not be split by the client.

    deprecated: false

/ngsi-ld/v1/ingestion/entities/{id}/on-seek:
  post:
    tags:
      - Data Ingestion Adaptor
    summary: Publish Data Using On-Seek
    operationId: postIngestionAdaptorEntitiesOnSeek
    security:
      - authorization: [ ]

    x-codeSamples:
      - lang: 'cURL'
        label: 'data publish'
        source: |
          curl --location --request POST 'https://example.com/ngsi-ld/v1/ingestion/entities/{id}/on-seek' \
          --header 'token: <tokenValue>'
          --header 'Content-Type: application/json' \
          --data-raw '<payload>'

    requestBody:
      description: Payload of the data to be pushed for a particular id.
      content:
        application/json:
          schema:
            $ref: '../components/schemas/ingestion.yaml#/ingestionEntityRequest2'
      required: true
    parameters:
      - name: id
        in: path
        required: true
        description: 'A <b> valid data exchange ID </b> of the resource. <br/> Information about the data exchange ID of the resource and security scope of the resource can be obtained from the <b> DX(Data exchange) Controlplane server </b> .'
        schema:
          type: string
          format: uuid
    responses:
      200:
        description: 'Successful pushed the data'
        content:
          application/json:
            schema:
              $ref: '../components/schemas/ingestion.yaml#/adapterIngestionEntities'

      401:
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/NgsiLdSubscriptionErrorResponse401'

      404:
        description: Not Found
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/NgsiLdSubscriptionErrorResponse404'

      400:
        description: Bad Request
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/NgsiLdSubscriptionErrorResponse400'


    description: |
      Post Ingestion Entities API allows a publish data into DX(Data exchange) Dataplane Server. Based on the input provided, the API validates the access control of the user with DX(Data exchange) Auth server to allow or deny access to the API.

    deprecated: false

