            <br/>The list is <b>case sensitive</b>
        coordinates:
          type: array
          minItems: 1
          maxItems: 10
          items:
            type: number
          description: 'The coordinates for a specific geometry query type. <br/>
            This parameter accepts both <b> one dimentional array and multi dimentional
            arrays </b> based on the <b> geometry</b> type. <br/> For e.g, [longitude-1,latitude-1]
            should be used for geometry <b>point</b>.  <br/>[[[longitude-1,latitude-1],
            [longitude-2,latitude-2],...., [longitude-n,latitude-n]]] should be used
            for geometry <b>polygon</b>. <br/> [[longitude-1,latitude-1], [longitude-2,latitude-2],....,
            [longitude-n,latitude-n]] should be used for geometry <b>bbox and linestring
            </b>. <br/> Maximum of 10 latitude, longitude pairs can be used for geometry
            <b>polygon, bbox and linestring </b>. <br/> Note: The data-type of this
            field is a string, therefore the coordinates are a string encoded multidimensional
            array. <br/> Maximum precision allowed is upto 6 decimal places.'
        georel:
          type: string
          enum:
            - within
            - contains
            - intersects
          description: The relation type of <b>geoquery</b> to be performed. <br/>
            This <b>should</b> be one from the available options in the Enum list.
            <br/> The relation <b> near </b> should be always accomodated with a <b>
            maxdistance </b> property. <br/> Apart from <b> maxdistance</b> , all
            other fields in the Enum list are <b> case sensitive </b> fields. <br/>
            The relation <b> near;maxdistance </b> is applicable only for a <b> point
            </b>.  <br/> The relation <b> within </b> and  <b> intersects </b> are
            applicable only for <b> bbox, polygon and linestring</b>.
        geoproperty:
          type: string
          enum:
            - location
          description: Name of the <b> geospatial </b> property in the <b> DX(Data
            exchange) data descriptor </b>. <br /> The current version of the API
            <b> mandates </b> it to be equal to `location`
      example:
        geometry: Point
        coordinates:
          - 25.319768
          - 82.987988
        georel: near;maxDistance=1000
        geoproperty: geoJsonLocation
