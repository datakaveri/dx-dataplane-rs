openapi: 3.0.2

info:
  title: "Data exchange Resource Server APIs"
  version: 1.1.0
  description: |
    # Introduction
    The Resource Server is DXs'(Data exchange) data store which allows publication, subscription and discovery of data.
    For search and discovery, it allows users to search through temporal, geo-based and attribute queries. 
    For publication and subscription, it allows users to use AMQP streaming protocol over TLS.
    It enables *Providers* of datasources to publish data as per the DX(Data exchange) data descriptor.
    It enables *Consumers* of datasources to search and query for data using HTTPs APIs.
    
    # Configurations
    - **Server**: 
      - In the doc, we display the server url to be https://example.com with the hostname as example.com
      - This could be configured according to the deployment
    - **Base path**:
      - Base path is the path on which API is served, relative to the host
      - It is the initial part of the API
      - These base path values could be configured according to the deployment
      - The base path for [DX AAA Server](https://github.com/datakaveri/iudx-aaa-server) is set to `/auth/v1`
      - The base path for [DX Catalogue Server](https://github.com/datakaveri/iudx-catalogue-server) is set to `/iudx/cat/v1`
      - Currently, the following APIs have `/ngsi-ld/v2` base path
          -  /entities/{id}
          -  /entities/{id}/search
          -  /{id}/download
      <br>
    - **Request Samples**:
      - The `<tokenValue>` in the header of request sample could be replaced with respective token value [Also refer Tokens section [here](#section/Tokens)]
      - The `<publicKeyValue>` in the header of request sample could be replaced with the respective public key [Also refer Encryption section [here](#section/Encryption)]
      - The `<payload>` in the request sample could be replaced with the payload given adjacent to the request sample
    
    
    # Tokens
    All the <b>*Search API*</b>  calls to the resource server should now contain a valid data exchange auth token presented in the query header. To search (or) access an *Open* resource, the consumer should present a valid data exchange Auth token. To search (or) access a *Secure / Closed* resource, a consumer must get a token for the *Secure / Closed* resource along with the associated constraints from the DX(Data exchange) Auth Server. For subscription to a *Secure / Closed / Open* resource, a consumer must get a token along with the associated constraints from the DX(Data exchange) Auth Server.
    
    # Pagination
    Resource server also offers way to paginate the result for queries. If a query returns large number of records then user can use additional parameters in query parameters to limit numbers of records to be returned.
    
    - <b> Pagination is applicable only for</b>
       - <b>/entities/{id}</b>
       - <b>/entities/{id}/search</b>
       - <b>/{id}/download</b>\
    
    Additional query parameters to be used:
      - <b>offset</b> : The from parameter defines the offset from the first result you want to fetch,  ( <i>default : 0</i> ,<i>minValue: 0</i>, <i>maxValue: 49999</i> )
      - <b>limit</b> : The size parameter allows you to configure the maximum results to be returned  ( <i>default: 5000</i> ,<i>minValue: 0</i>, <i>maxValue: 5000</i> )
    
    # Encryption
    All the count and search APIs have a feature to get encrypted data.
    The user could provide a `publicKey` in the header. 
    The header value should be in _url-safe base64 format_. 
    
    **Encryption is applicable only for**
    -  **/entities**


    # API HTTP Responses
    Apart from the response codes specified in each API, the API server may respond with certain 4xx and 5xx error codes which are related to common API Gateway behaviours.
    The application should address them accordingly.

  contact:
    name: For support contact CDPG Team at
    email: support@cdpg.org.in
    url: https://dataforpublicgood.org.in/
  license:
    name: Apache 2.0

tags:
  - name: Temporal Entities
    x-displayName: "Temporal and Complex Search"
    description: |
      A Temporal Search is used by DX(Data exchange) Data *Consumers* for querying a resource using a <b>valid data exchange</b> `id`, `temporal`, `spatial` and `attribute` parameters. <br/> Information about the data exchange ID of the resource and security scope of the resource can be obtained from the <b> DX(Data exchange) catalogue server </b>. <br/>In order to use this API, a `temporal` parameter is <b>mandatory</b>. <br/> You can use this API to make a `temporal` or `complex : temporal+spatial` or `complex : temporal+attribute` or `complex : temporal+spatial+attribute` query. <br/> If you are looking for an `attribute` only query refer the <b>Spatial Search</b> `/entities` endpoint.
  - name: Download CSV
    x-displayName: "Download"
    description: |
      Download APIs are used by DX(Data exchange) Data to stream data in csv.
  - name: Search Entity
    x-displayName: "Search Data"
    description: |
      A Search query is used by DX(Data exchange) Data *Consumers* for discovering entities that meet complex criteria. The `/search` endpoint supports a rich combination of property-based (`term`), range-based, and temporal-based searches and geo-spatial search using a common `searchCriteria` array format.
  - name: Latest Entity
    x-displayName: "Latest Data"
    description: |
      A Latest Search query is used by DX(Data exchange) Data *Consumers* for querying a resource using a <b>valid data exchange</b> `id`. Information about the data exchange ID of the resource and security scope of the resource can be obtained from the <b> DX(Data exchange) catalogue server </b> . Latest APIs get the latest data belonging to the given valid DX `id`. The user could provide a valid access token while using the API.

servers:
  - url: 'https://example.com/'
    description: 'Development Server URL'

# Global security definition (applies to all paths unless overridden)

paths:
  /ngsi-ld/v2/temporal/entities:
    get:
      tags:
        - Temporal Entity
      operationId: getTemporalEntities
      summary: Temporal Entities Search
      description: Search for temporal entities with various filters
      security:
        - authorization: [ ]
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: timerel
          in: query
          required: true
          description: Temporal relation type
          schema:
            type: string
            enum: [ between, before, after]
        - name: timeAt
          in: query
          required: true
          description: Start time in ISO8601 format
          schema:
            type: string
        - name: endTimeAt
          in: query
          description: End time in ISO8601 format
          schema:
            type: string
        - name: timeproperty
          in: query
          description: Time property to filter on
          schema:
            type: string
            enum: [ observationDateTime ]
        - name: limit
          in: query
          description: Limit the no of data to be shown
          schema:
            type: integer
            minimum: 1
            default: 100
        - name: offset
          in: query
          description: Offset to see more data
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: count
          in: query
          description: Include count of matching entities in the response
          schema:
            type: boolean
            default: false
        - name: q
          in: query
          description: For attribute based search. The attribute query is used for querying allowed quantitative properties. Used to query on a value of a resource attribute using <,>,<=,>=,!=, == operators. For e.g, attribute > value, attribute < value, attribute >= value, attribute <= value, attribute != value and attribute == value. Allowed values for all operators is double. For the operator == if the query is on id then the only value allowed is an data exchange ID of a resource. Multiple value is allow with comma(,) separate, maximum 10 values is allowed.
          schema:
              type: string
        - name: omit
          in: query
          description: Comma-separated list of properties to omit from the response, maximum value is allow is 5.
          schema:
              type: string
        - name: pick
          in: query
          description: Comma-separated list of properties to pick from the response, maximum value is allow is 5.
          schema:
            type: string
        - name: geometry
          in: query
          description: GeoJSON geometry type
          schema:
            type: string
            enum: [ Point, Polygon, LineString, bbox, point, polygon, linestring, BBOX ]
        - name: coordinates
          in: query
          description: Coordinates for the geometry
          schema:
            type: string
        - name: georel
          in: query
          description: Spatial relationship type
          schema:
            type: string
            enum: [ near;maxdistance, within, intersects ]
        - name: geoproperty
          in: query
          description: Geospatial property name
          schema:
            type: string
            enum: [ location ]
      responses:
        '200':
          description: Successful retrieval of temporal entities
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/entityresponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/standardBadRequestErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/standardInvalidTokenErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/standardResourceNotFoundErrorResponse'

  /ngsi-ld/v2/entities/{id}:
    get:
      tags:
        - Latest Entity
      summary: Latest Data
      operationId: getLatestEntityData
      description: |
        The <b> Latest Data API </b> is used to get the latest (last published) data of a resource. <br /> It uses the <b> data exchange ID </b> a.k.a `id` to query the resource server. <br />  To get data a <b> valid data exchange token</b> is mandatory.  <br/> The `/entities` end point followed by `id` as a <b>path parameter</b> is used to get the latest data.
        By default data is sorted in descending order of the `observationDateTime` property. <br/>
        Note: time and endTime parameters are only supported if timeRel is given.
      security:
        - authorization: [ ]
      parameters:
        - name: id
          in: path
          description: 'A <b> valid data exchange ID </b> of the resource. <br/> Information about the data exchange ID of the resource and security scope of the resource can be obtained from the <b> DX(Data exchange) catalogue server </b> .'
          required: true
          schema:
            type: string
            format: uuid
            maxLength: 36
        - name: page
          in: query
          description: 'The page parameter is used to specify the page number of the result set. <br/> It is an optional parameter. <br/> If not provided, it defaults to 1.'
          required: false
          schema:
            type: integer
        - name: size
          in: query
          description: 'The size parameter is used to specify the number of results per page. <br/> It is an optional parameter. <br/> If not provided, it defaults to 10.'
          required: false
          schema:
            type: integer
        - name: timeRel
          in: query
          description: 'The temporal relation type of <b>timerel</b> to be performed. <br/> This <b>should</b> be one from the available options in the Enum list. <br/> If the relation is <b> between </b> it should be always accomodated with a <b> time </b> and <b> endtime </b> property.  <br/> If the relation is <b> before </b> or <b> after </b>it should be always accomodated <b> only</b> with a <b> time </b> property.'
          required: false
          schema:
            type: string
            enum: [ between, before, after ,during ]
        - name: time
          in: query
          description: 'This parameter specifies the <b>start time</b> for the temporal-query in `ISO8601` format. <br/> data exchange currently accepts `IST` and `UTC` time zones for the temporal query.'
          required: false
          schema:
            type: string
        - name: endTime
          in: query
          description: 'This parameter specifies the <b>end time</b> for the temporal-query in `ISO8601` format. <br/> data exchange currently accepts `IST` and `UTC` time zones for the temporal query. <br/>If <b>timerel</b> is `between` time and endtime are mandatory'
          required: false
          schema:
            type: string
        - name: sort
          in: query
          description: 'This parameter is used to sort the results basis on this property. <br/> The default sortBy property is `observationDateTime:desc` . <br/> The user could provide any property among `observationDateTime` and `itemCreatedAt` of the resource to sort the data. <br/> If the user provides a property which is not part of the resource, the API will throw a `400-Bad Request` error.'
          required: false
          schema:
            type: string
            enum: [ observationDateTime:desc, itemCreatedAt:desc, observationDateTime:asc, itemCreatedAt:asc ]

      responses:
        200:
          description: 'Successful retrieval of latest data'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/entityresponse'
        204:
          description: 'Empty Response'

        400:
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/invalidParamBadRequestErrorResponse"
          description: 'Bad query - Empty response | Missing/Invalid temporal parameters | Missing/Invalid geo parameters | Count is not supported with filtering'

        401:
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/standardInvalidTokenErrorResponse"
          description: |-
            - Unauthorized - `token` invalid/expired
            - Unauthorized - `clientId` & `clientSecret` invalid/not match

        404:
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/standardResourceNotFoundErrorResponse"
          description: 'Resource not found'

        413:
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/payloadTooLarge"
          description: 'Payload Too Large'

      x-codeSamples:
        - lang: 'cURL'
          label: 'get latest data'
          source: |
            curl --location --request GET 'https://example.com/ngsi-ld/v1/entities/UUID' \
            --header 'token: <tokenValue>'

        - lang: 'cURL'
          label: 'get encrypted data'
          source: |
            curl --location --request GET 'https://example.com/ngsi-ld/v1/entities/UUID' \
            --header 'token: <tokenValue>' \
            --header 'publicKey: <publicKeyValue>'

          description: |
            The <b> Latest Data API </b> is used to get the latest (last published) data of a resource. <br /> It uses the <b> data exchange ID </b> a.k.a `id` to query the resource server. <br />  To get data a <b> valid data exchange Auth token</b> is mandatory.  <br/> The `/entities` end point followed by `id` as a <b>path parameter</b> is used to get the latest data.

      deprecated: false

  /ngsi-ld/v2/entities/{id}/search:
    post:
      tags:
        - Search Entity
      summary: Data Post Search
      description: |
        Unified catalogue search query for discovering entities that meet complex criteria. The `/search` endpoint supports a rich combination of property-based (`term`), range-based, and temporal-based searches using a common `searchCriteria` array format.
        
        #### 📌 `searchCriteria` Format (Unified)
        Each entry in `searchCriteria` must define:
        - `searchType`: Determines the type of search (e.g., `term`, `betweenRange`, `beforeTemporal`, etc.)
        - `field`: Field to search on (e.g., `type`, `dataReadiness`, `itemCreatedAt`)
        - `values`: Array of values (length depends on `searchType`)
        
        #### ✅ Supported `searchType` Values and Value Expectations:
        | `searchType`         | Description                                 | Expected `values` Length |
        |----------------------|---------------------------------------------|---------------------------|
        | `term`               | Property-based (exact/approx match)         | ≥ 1 values (OR logic)     |
        | `betweenRange`       | Numeric field in a value range              | 2 values (start, end)     |
        | `beforeRange`        | Numeric field before a value                | 1 value                   |
        | `afterRange`         | Numeric field after a value                 | 1 value                   |
        | `betweenTemporal`    | Timestamp field between two dates           | 2 ISO datetime strings    |
        | `beforeTemporal`     | Timestamp before a given date               | 1 ISO datetime string     |
        | `afterTemporal`      | Timestamp after a given date                | 1 ISO datetime string     |
        
        #### 🧠 Term Search (Property-based)
        Property search is allowed only on a predefined set of properties from the DX Schema Vocabulary, applicable to all subClasses of [IUDXEntity](https://voc.iudx.org.in/IUDXEntity).
        
        - Exact match: Supported for fields like `id`, `type`, `department`, `organizationType`, `modelType`. <br>
        
        Example:
        ```json
        {
          "searchCriteria": [
            {
              "searchType": "term",
              "field": "type",
              "values": ["adex:DataBank"]
            },
            {
              "searchType": "term",
              "field": "department",
              "values": ["Health", "Environment"]
            }
          ]
        }
        ```
        
        #### 📈 Range Search (Numeric)
        Filters based on numeric values and supports various relational conditions.
        - Supported `searchType` values:
          - "betweenRange" → values: [min, max]
          - "beforeRange" → values: [value] (less than)
          - "afterRange" → values: [value] (greater than)
        Example:
        ```json
        {
          "searchType": "betweenRange",
          "field": "dataReadiness",
          "values": [50, 80]
        }
        ```
        
        #### 🕒 Temporal Search
        Filters based on ISO 8601 timestamps for temporal fields.
        - Supported `searchType` values:
          - "betweenTemporal" → values: ["startTime", "endTime"]
          - "beforeTemporal" → values: ["timestamp"]
          - "afterTemporal" → values: ["timestamp"]
        Timestamps must be in ISO 8601 format (`YYYY-MM-DDTHH:mm:ss±hhmm`).
        Example:
        ```json
        {
          "searchType": "beforeTemporal",
          "field": "itemCreatedAt",
          "values": ["2025-04-30T00:00:00+0530"]
        }
        ```
        
        #### Text Search
        A full-text fuzzy search over indexed fields.
        - Use the `q` field in the root body.
        - Optional flags: `autoComplete`, `fuzzy`.
        
        #### Complex Search
        Multiple search types—text, property-based (`term`), temporal, and numeric range—can be combined together in a single request using the `searchCriteria` array. Each object in `searchCriteria` must include a `searchType`, the `field` to query, and the appropriate `values` for that type.
        
        Text-based search can be combined with structured filters. It supports full-text fuzzy matching across indexed fields.
        
        #### Supported fields for complex search:
        
        - `q`: A free-form text string to perform full-text search across indexed fields.
        - `fuzzy`: (Optional, boolean) Enables approximate/fuzzy matching.
        - `autoComplete`: (Optional, boolean) Enables search-as-you-type behavior.
        
        #### Spatial (Geo) Search
        Geo search accepts geojson based queries. The params and their accepted values are briefed below -
          - <b>geoproperty</b>: 
              - Specifies the name of the <b> geospatial </b> property in the <b> DX(Data exchange) data descriptor </b>.
              - The current version of the API <b> mandates </b> it to be equal to `location`
          - <b>georel</b>:   
              - Specifies the spatial relationship to be queried.
              - The relation type of <b>geoquery</b> can be <b>one of</b> `near;maxdistance=<distance_in_meters>`, `within`, `intersects`.
              - The relation <b> near </b> should be always accomodated with a <b> maxdistance </b> property.
              - Apart from <b> maxdistance</b> , all other fields in the Enum list are <b> case sensitive </b> fields.
              - The relation <b> near;maxdistance </b> is applicable only for a <b> point </b>.
              - The relation <b> within </b> and  <b> intersects </b> are applicable only for <b> bbox, polygon and linestring</b>.

          - <b>geometry</b>:  
              - Specifies the GeoJson geometries. 
              - Should be One of `Point`(equivalent for a circle), `Polygon`, `LineString`, `bbox`.
              - <b>Point</b>: Point and radius query
                  - coordinates: Specifies the  center point of the circle, for e.g, `[73,13]`. <br/>Note, format is [longitude, latitude]
                  - maxDistance: Specifies the Radius from the center point in meters, for e.g `100`. `maxValue` : 1000
                  - georel: In this version of DX(Data exchange) API, the allowed relationship search for a circle is `near` with a `maxdistance` in meters specified. This will be equivalent to a `within` query. Format is `near;maxdistance=<distance_in_meters>` 
              - <b>Polygon</b>: Polygon/Multi-Polygon query
                  - coordinates: Specifies the  coordinates of the polygon, for e.g, `[[[73,13],[73,12],[73,13]]]`.  <br/>Note, format is [longitude, latitude] and the first coordinate must be same as last. 
                  - `minNumberOfCoOrdinates` : 4 and `maxnNumberOfCoOrdinates` : 10
                  - georel: `within`, `intersects`
              - <b>LineString</b>: Multi line string
                  - coordinates: Specifies the coordinates of the multi-line, for e.g, `[[73,13],[74,15],[75,16]]`. <br/>Note, format is [longitude, latitude]
                  - `minNumberOfCoOrdinates` : 2 and `maxnNumberOfCoOrdinates` : 10
                  - georel:  `within`, `intersects`
              - <b>bbox</b>: Bounding box
                  - coordinates: `[[top-left],[bottom-right]]`. e.g, `[[73,13],[74,12]]`. <br/>Note, format is [longitude, latitude].
                  - georel:  `within`, `intersects`
        
        
        #### Supported `searchType` values in `searchCriteria`:
        
        - `term`: Property-based filtering using exact or fuzzy match. Accepts one or more
        values. (OR logic on values.)
        - `betweenTemporal`: Requires exactly **two** ISO 8601 datetime strings — interpreted as start and end time.
        - `beforeTemporal`: Requires exactly **one** ISO 8601 datetime string — filters entries before the given time.
        - `afterTemporal`: Requires exactly **one** ISO 8601 datetime string — filters entries after the given time.
        - `betweenRange`: Requires exactly **two** numeric values — interpreted as lower and upper bounds.
        - `beforeRange`: Requires exactly **one** numeric value — filters entries below the threshold.
        - `afterRange`: Requires exactly **one** numeric value — filters entries above the threshold.
        
        This unified format supports rich multi-dimensional filtering with both structured and unstructured (text) data.
        
        #### Example:
        ```json
        {
          "q": "satellite",
          "fuzzy": true,
          "autoComplete": true,
          "searchCriteria": [
            {
              "searchType": "term",
              "field": "type",
              "values": ["adex:DataBank"]
            },
            {
              "searchType": "betweenTemporal",
              "field": "itemCreatedAt",
              "values": ["2024-01-01T00:00:00+0530", "2025-01-01T00:00:00+0530"]
            },
            {
               "searchType": "afterRange",
               "field": "dataReadiness",
               "values": [70]
            }
          ]
        }
        ```
        
        #### Limits and Filters
        - Pagination: Use `size` and `page` parameters to paginate results.
          For example, `size=100&page=2` returns 100 results starting from the 101st record (i.e., page 2).
          Internally, the offset is calculated as `offset = size * (page - 1)`.
        - Field Filtering: Use the `filter` parameter to specify a subset of fields to return.
          For example, `filter=[id]` returns only the `id` field for each result.
        - Limits: The sum of the internally calculated `offset` and `size` must be less than or equal to `10,000` to prevent overly large queries.

      operationId: postLatestEntityDataSearch
      security:
        - authorization: [ ]
      parameters:
        - name: id
          in: path
          required: true
          description: 'A <b> valid data exchange ID </b> of the resource. <br/> Information about the data exchange ID of the resource and security scope of the resource can be obtained from the <b> DX(Data exchange) catalogue server </b> .'
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          description: Page number for pagination
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: size
          in: query
          description: Page size for pagination
          required: false
          schema:
            type: integer
            minimum: 1
            default: 100
        - name: sort
          in: query
          description: >
            This parameter allows sorting the results by up to 3 fields, separated by a semicolon (;).
            The format for each field is `fieldName:asc` or `fieldName:desc`.
            For example: `itemCreatedAt:desc;dataReadiness:asc;name:desc` will sort by creation date (descending),
            then dataReadiness (ascending), then name (descending).
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              anyOf:
                - $ref: '#/components/schemas/TextSearchRequest'
                - $ref: '#/components/schemas/SearchCriteriaRequest'
                - $ref: '#/components/schemas/AutocompleteFuzzyTextSearchRequest'
                - $ref: '#/components/schemas/ComplexSearchRequest'
                - $ref: '#/components/schemas/AutocompleteFuzzyTextSearchRequest'
                - $ref: '#/components/schemas/GeoSearchRequest'
      responses:
        '200':
          description: All the query parameters yielded results.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/successResponseForAutocompleteFuzzyTextSearch'
                  - $ref: '#/components/schemas/successResponseForSearchByItemType'
                  - $ref: '#/components/schemas/successResponseForRangeSearch'
                  - $ref: '#/components/schemas/successResponseForTemporalSearch'
                  - $ref: '#/components/schemas/successResponseForComplexSearch'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorResponseForDiscovery'
              examples:
                Invalid Geo Value:
                  value:
                    type: 'urn:dx:cat:InvalidGeoValue'
                    "title": "Geoquery value error"
                    "detail": "Invalid value for a query param"
                Invalid Syntax:
                  value:
                    "type": "urn:dx:cat:InvalidSyntax"
                    "title": "Invalid Syntax"
                    "detail": "Invalid value for a query param"
                Invalid Syntax 1:
                  value:
                    "type": "urn:dx:cat:InvalidSyntax"
                    "title": "Invalid Syntax"
                    "detail": "Mandatory field(s) not provided"
                Precision validation:
                  value:
                    "title": "failed"
                    "type": "urn:dx:cat:InvalidPropertyValue"
                    "detail": "The max point of 'coordinates' precision is 6"
                Coordinate pair:
                  value:
                    "title": "failed"
                    "type": "urn:dx:cat:InvalidPropertyValue"
                    "detail": "The max number of 'coordinates' value is 10"
                Max Distance limit:
                  value:
                    "title": "failed"
                    "type": "urn:dx:cat:InvalidPropertyValue"
                    "detail": "The 'maxDistance' should range between 0-10000m"
                Coordinates value limit:
                  value:
                    "title": "failed"
                    "type": "urn:dx:cat:InvalidPropertyValue"
                    "detail": "Unable to parse 'coordinates'; value is Infinity"
                Invalid request - Max string size:
                  value:
                    "title": "failed"
                    "type": "urn:dx:cat:InvalidPropertyValue"
