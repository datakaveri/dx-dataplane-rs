            \ attribute < value, attribute >= value, attribute <= value, attribute\
            \ != value and attribute == value. \n Allowed values for all operators\
            \ is double. \n For the operator `==` if the query is on `id` then the\
            \ only value allowed is an `data exchange ID` of a resource."
        attrs:
          type: string
          maxLength: 512
          description: "The attrs parameter is used as an **application filter**.\
            \ \n This is an optional parameter. It can be used to provide the list\
            \ of attributes which the consumer expects to be responded by the server.\
            \ \n The consumer is expected to provide **only** the attributes available\
            \ in the **data descriptor** of the item in the DX(Data exchange) Catalogue.\
            \ \n Minimum of 1 and a Maximum of 5 attributes can be provided in a comma\
