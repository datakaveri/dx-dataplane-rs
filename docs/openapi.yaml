        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NgsiLdSubscriptionErrorResponse401'

        404:
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NgsiLdSubscriptionErrorResponse404'

        400:
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NgsiLdSubscriptionErrorResponse400'


      description: |
